name: zhongwen-shortdrama-v011

services:
  app:
    # V0.1.1 runs on an AMD64 ECS. Keep the target explicit so a release
    # prepared on an ARM development machine cannot silently publish ARM bits.
    platform: ${SHORTDRAMA_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        NODE_VERSION: "22.19.0"
        NPM_VERSION: "11.11.0"
        # 制品身份。Compose 读不到 git,由调用方传入(scripts/release-amd64.sh 会
        # 填);留空则镜像的 /api/v1/health 显示 sha=unknown,不会构建失败。
        GIT_SHA: "${SHORTDRAMA_GIT_SHA:-}"
        GIT_REF: "${SHORTDRAMA_GIT_REF:-}"
        BUILD_TIME: "${SHORTDRAMA_BUILD_TIME:-}"
    image: ${SHORTDRAMA_IMAGE:-zhongwen-shortdrama:v0.1.1-local}
    init: true
    env_file:
      - ${SHORTDRAMA_ENV_FILE:-.env}
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # Do not accept a host address from a copied local .env file.
      POSTGRES_HOST: db
      # Docker Desktop injects host proxy vars into containers; in-cluster
      # traffic must never route through them. Empty disables (ECS: no-op).
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    volumes:
      - shortdrama-runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  db:
    platform: ${SHORTDRAMA_PLATFORM:-linux/amd64}
    image: postgres:16-alpine
    env_file:
      - ${SHORTDRAMA_ENV_FILE:-.env}
    volumes:
      - shortdrama-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: unless-stopped

  caddy:
    platform: ${SHORTDRAMA_PLATFORM:-linux/amd64}
    image: caddy:2.8-alpine
    environment:
      # Same rationale as app: keep reverse_proxy upstream traffic direct.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${SHORTDRAMA_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    # The official caddy binary carries file capabilities (setcap for :80);
    # exec fails under no-new-privileges unless this cap stays in the bounding set.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  shortdrama-runtime:
  shortdrama-postgres:
  caddy-data:
  caddy-config:
