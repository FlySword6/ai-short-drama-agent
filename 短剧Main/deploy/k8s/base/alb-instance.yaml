apiVersion: loadbalancer.vke.volcengine.com/v1beta1
kind: ALBInstance
metadata:
  name: shortdrama-alb
  labels:
    app.kubernetes.io/name: shortdrama
    app.kubernetes.io/component: ingress
spec:
  instanceID: clb-13f4w460szabk3n6nu5ki5jao
  blockCascadeDeletion: true
  listeners:
    # HTTP-80 保持全环境可用;HTTPS-443 + 证书(证书中心 cert_center)由环境 overlay 追加,
    # base 不写死证书 ID,避免 dev/test 误带 prod 证书。
    - protocol: HTTP
      port: 80
