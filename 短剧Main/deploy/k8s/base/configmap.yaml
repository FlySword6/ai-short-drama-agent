# ============================================================================
# 这份文件现在【没有生效】。别以为改了它线上就变了,也别以为它写的就是线上跑的。
#
# 2026-08-11 实查(`kubectl -n shortdrama get deploy shortdrama-main`):
#   - 测试集群里 50 个环境变量【全部内联挂在 deployment 上】;
#   - `kubectl -n shortdrama get configmap` 只有 kube-root-ca.crt,
#     本 ConfigMap 从来没有被 apply 过;
#   - deployment 的 `envFrom` 是空的。
# 也就是说:今天改这个文件,产品行为零变化。它是一份【声明】,不是运行时真源。
#
# 那为什么还要维护它?因为 2026-08-11 产品负责人拍板「仓库是真源,让它真生效」。
# 本次提交先把【声明】校准到与线上一致,接线是下一步、单独的部署变更。
#
# ---- 接线前必须知道的三件事(别顺手 apply)----
# 1. 名字对不上:本 base 的 Deployment 叫 `shortdrama`,线上叫 `shortdrama-main`,
#    Service / Ingress / 选择器全不同名。`kubectl apply -k` 不会更新线上那套,
#    而是在同命名空间【新建一整套并行对象】。
# 2. 光加 envFrom 不够:Kubernetes 里内联 env 的优先级高于 envFrom。只要那 50 个
#    内联 env 还在,本文件的值就盖不上去。必须先删内联 env 才谈得上生效。
# 3. 缺前置对象:集群里没有 ServiceAccount `shortdrama-runtime`、没有
#    ConfigMap `shortdrama-rds-ca`,KMS initContainer 会认证失败,Pod 起不来。
# 4. TLS 口径此刻是分裂的:下面 `POSTGRES_SSL_MODE` 已按现有 Pod 的现实降到
#    `disable`(那个 Pod 没挂 CA,理由见该键的注释),而
#    `deploy/k8s/secret-init/main.go:210` 读到非 `verify-full` 会直接退出。
#    所以整包 apply 的话 initContainer 起不来。这条与第 3 条同因同解:
#    先把 CA 真挂上,再把本文件改回 `verify-full`。
#
# ---- 本文件与线上的差异口径 ----
# 「两边都有但值不同」的键:一律以线上实测值为准(线上是唯一验证过能跑的)。
# 「只有本文件有」的键:是应用默认值的声明,线上不配则代码走默认,保留。
# 「只有线上有」的键:密钥永不进本文件;非密且代码真消费的已补齐。
# 逐条依据见 issue #239 与本次 PR 正文。
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortdrama-runtime
  namespace: shortdrama
  labels:
    app.kubernetes.io/name: shortdrama
    app.kubernetes.io/component: runtime
  annotations:
    # 这四条是【部署期门禁标记】,不是运行时配置。读取方只有
    # deploy/k8s/verify-rendered.sh(校验渲染产物),格式固定
    # docs/validation/<file>.json@sha256:<digest>。
    # 原先它们放在 data 里,会被 envFrom 原样灌进 Pod 的环境变量——
    # 也就是让「REPLACE_WITH_*」这种没填的占位符进运行时环境。应用不会因此报错
    # (src/config/env.ts 的 zod schema 不是 strict,未知键被丢弃),但没道理留着。
    shortdrama.zhongwen.com/rds-private-connectivity-evidence: REPLACE_WITH_RDS_PRIVATE_CONNECTIVITY_RECEIPT
    shortdrama.zhongwen.com/admin-bootstrap-evidence: REPLACE_WITH_EXISTING_ADMIN_MIGRATION_RECEIPT
    shortdrama.zhongwen.com/alb-pod-direct-access-preflight-evidence: REPLACE_WITH_ALB_POD_DIRECT_ACCESS_PREFLIGHT_RECEIPT
    shortdrama.zhongwen.com/vci-pod-security-group-preflight-evidence: REPLACE_WITH_VCI_POD_SECURITY_GROUP_PREFLIGHT_RECEIPT
data:
  APP_NAME: Shortdrama Test
  APP_VERSION: "0.3.0"
  DEBUG: "false"
  HOST: 0.0.0.0
  PORT: "8000"
  SESSION_TTL_HOURS: "168"
  AUTH_PASSWORD_MIN_LENGTH: "12"
  # Legacy compatibility only:应用不消费此开关。验证码可用性由
  # NODE_ENV + AUTH_EMAIL_DELIVERY_MODE 决定；当前 production+dev_log fail-closed。
  AUTH_REGISTRATION_ENABLED: "true"
  AUTH_REGISTRATION_INVITE_CODES: ""
  # 本包不接真实邮件服务。production 下 dev_log 会 fail-closed，防止验证码静默写日志。
  AUTH_EMAIL_DELIVERY_MODE: "dev_log"
  AUTH_EMAIL_VERIFICATION_TTL_SECONDS: "600"
  AUTH_EMAIL_VERIFICATION_MAX_ATTEMPTS: "5"
  # 企业微信默认关闭。CorpSecret 不属于 ConfigMap，由 KMS 可选键注入。
  WECOM_LOGIN_ENABLED: "false"
  WECOM_CORP_ID: ""
  WECOM_AGENT_ID: ""
  WECOM_CALLBACK_URL: ""
  WECOM_STATE_TTL_SECONDS: "300"
  # base 这一层就是测试环境,而测试环境按运行时护栏跑在 NODE_ENV=production 上,
  # 所以「开发和测试允许多处同时登录」这条在这里推导不出来,必须显式写死。
  # 生产由 overlays/prod 覆盖回 true。
  AUTH_SINGLE_ACTIVE_SESSION: "false"
  NODE_ENV: "production"
  ADMIN_USERNAMES: ""
  # 平台级建项目开关:数据库角色仍是运行时权威,此键只决定普通成员能否新建项目。
  # 线上是 true,config/README.md 第三节也写明测试环境必须开(周一验收要用)。
  # 本文件原先是 false,与线上和 README 两处都打架,按线上改齐;
  # deploy/k8s/tests/manifests.test.sh 里那条「必须 false」的断言同步改了。
  ALLOW_MEMBER_CREATE_PROJECT: "true"
  TRASH_RETENTION_DAYS: "180"
  GENERATION_WORKER_POLL_INTERVAL_MS: "5000"
  GENERATION_TASK_LEASE_SECONDS: "180"
  ALLOW_PAID_GENERATION: "true"
  PAID_GENERATION_BUDGET_FEN: "50000"
  PAID_GENERATION_REVIEW_THRESHOLD_FEN: "40000"
  DATABASE_URL: ""
  # ⚠️ 这一项本次由私网端点改成了公网端点,是【降级到现实】,不是升级。
  # 原值 postgres4a3018919997.rds-pg.ivolces.com(私网)是目标态,
  # 但 docs/deploy/live-vs-repo-diff.md §6 自己承认:
  # 「内网 RDS 从 VCI Pod 的连通性:从未被证据链证明过」。
  # 线上这个公网端点是【当前唯一验证过能连上】的。写没验证过的值进来 = 接线即断库。
  # 换回私网的前提:先做一次 rds_private_connectivity 实测并留证据。
  # 这条是本 PR 交给产品负责人的头号待决项(安全上私网更好,但不能靠没验过的值上线)。
  POSTGRES_HOST: postgres-4a3018919997-public.rds-pg.volces.com
  POSTGRES_PORT: "5432"
  POSTGRES_DB: shortdrama
  POSTGRES_USER: shortdrama_test
  POSTGRES_SCHEMA: app
  # ⚠️ 这一项与上面 POSTGRES_HOST 是一套的,同样是【降级到现实】。目标态是 verify-full。
  # 上一版把 HOST 按现实降了、SSL_MODE 还留在目标态,结果是一个键按现实一个键按目标态。
  # 2026-08-11 实测:测试集群 shortdrama-main 的 Pod 里
  # `ls /etc/ssl/certs/volcengine-rds/ca.pem` 返回 No such file——那个 Pod 只挂了一个
  # /etc/localtime,集群里也不存在 ConfigMap shortdrama-rds-ca。
  # 而 src/db/tls.ts:32 是 readFileSync,拿不到文件直接抛,所以这个键一填 verify-full,
  # 接线即断库。接线当天正是靠 deployment 上一条内联 POSTGRES_SSL_MODE=disable
  # (内联 env 优先级高于 envFrom)才把 Pod 救起来;本次改完那条内联覆盖可以撤掉。
  # 换回 verify-full 的前提有两步,缺一不可:
  #   1. 把 base/rds-ca-configmap.yaml apply 进集群(那份 CA 仓库里早就有,只是没 apply);
  #   2. 给 shortdrama-main 补上 rds-ca 卷和 /etc/ssl/certs/volcengine-rds 挂载。
  # dev/prod overlay 不跟这条降级——它们没有历史 Pod,走整包部署,仍钉 verify-full。
  POSTGRES_SSL_MODE: disable
  # 保留不动:mode=disable 时 src/db/tls.ts:19 直接返回,根本不会去读这个路径。
  # 留着是为了上面两步做完后,只改 POSTGRES_SSL_MODE 一个键就能恢复。
  POSTGRES_SSL_ROOT_CERT: /etc/ssl/certs/volcengine-rds/ca.pem
  VKE_NETWORK_MODE: VPC-CNI
  VKE_TARGET_ID: cd9attb5fok2hjo1as48g
  # R195-5: provider credentials do not grant company billing authority.
  # Add newapi to this comma-separated list only after company-account review.
  # suchuang 是跟随线上补的:线上 allowlist 就是 ark,col,suchuang,
  # 且 SUCHUANG 三键都配着、开关是开的。本文件原先漏了它,接线会静默关掉速创图片通道。
  COMPANY_PROVIDER_ALLOWLIST: ark,col,suchuang
  ARK_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
  ARK_IMAGE_MODEL: doubao-seedream-5-0-pro-260628
  ARK_VIDEO_MODEL: doubao-seedance-2-0-fast-260128
  # 2026-08-10 夜里的修复结果,勿改回 doubao-seed-2-1-pro-260628。
  # 那个模型在 agent 工具路上 3/9 会挂:一次响应里六个工具调用只要有一个的参数
  # 不是合法 JSON(实测报文里 "gender": female 是裸词),整批直接抛错。
  # 实测记录见 issue #239 正文与评测 PR #234(此前误引为 #44,那是流水线
  # 治理卡,与模型无关)。改这三个键前先看那份记录。
  ARK_LLM_MODEL: deepseek-v4-flash-ga-260731
  # 复数键。src/config/env.ts:407 `ARK_LLM_MODELS ?? ARK_LLM_MODEL`,线上两个都配了,
  # 这里跟上,免得将来单数键一改、复数键还留着旧值。
  ARK_LLM_MODELS: deepseek-v4-flash-ga-260731
  # 2026-08-17 裁决追改(#379 / #380):原接入点值查实是 doubao-1-5-pro-32k
  # 250115 老模型(见 #380 调查记录),与 #190「统一 v4-flash」拍板不符,
  # 换为 deepseek-v4-flash-ga-260731,与 ARK_LLM_MODEL 统一。
  DOUBAO_LLM_MODEL: deepseek-v4-flash-ga-260731
  # 提示词 AI 只向前端暴露稳定档位键。两档目前都指向同一个 flash 模型——
  # 这是线上实配,不是笔误:2.1 Pro 因上面那个工具调用缺陷被整体换掉后,
  # 暂时没有第二个验证过的档位。分档要恢复得先验一个可用的精细档模型。
  AI_PROMPT_LLM_QUALITY_MODEL: deepseek-v4-flash-ga-260731
  AI_PROMPT_LLM_FAST_MODEL: deepseek-v4-flash-ga-260731
  # 同为接入点 ID,以线上为准;有效性未验证(见 PR 存疑项)。
  DOUBAO_EMBEDDING_MODEL: ep-20260630182837-rw8xw
  # ---- 公司 COL 文字通道:线上一个键都没配,本文件跟随线上,整组不写 ----
  # 原先这里写了 COL_TEXT_MODELS / COL_SCRIPT_BREAKDOWN_MODEL / COL_PROMPT_DRAFT_MODEL
  # / COL_PROMPT_TRANSLATE_MODEL 四个键。写了反而更危险:
  # src/config/env.ts:292 的 assertCompleteColGatewayConfiguration 是启动期
  # fail-closed——六项(COL_BASE_URL / COL_APIKEY / 上面四个)只要配了任意一项又不齐,
  # 直接抛「公司 COL 文字通道配置不完整」,应用起不来。而 COL_BASE_URL 与 COL_APIKEY
  # 走 KMS,本文件写不了,所以这四个键单独存在 = 接线即崩。
  #
  # 要真开公司通道,顺序是:先把 COL_BASE_URL + COL_APIKEY 放进 KMS
  # (deploy/k8s/secret-init/main.go:58 支持这对可选键,要求成对出现),再在这里补齐四个模型键。
  # 【补齐之前还要先做一件事】把这三个模型登记进 model_capabilities 表
  # (写入侧 scripts/sync-model-capabilities.mts)。表里查不到的模型,输出预算会
  # 无声回落到 src/modules/ai/modelCapabilities.ts:49 的
  # CONSERVATIVE_FALLBACK_MAX_OUTPUT_TOKENS = 4096——不报错、不拒绝,
  # 拆解长剧本会直接被截断,现象是「模型变笨了」,极难往配置上想。
  # 视觉理解模型;留空时按 src/config/env.ts 的 visionModel 链回退。
  DOUBAO_VISION_MODEL: ""
  # visionModel 回退链(env.ts:445)的第一环就是这个小写键,线上配着它。
  # 名字看着像拼错的死键,其实是活的——丢了视觉模型会掉到 DOUBAO_LLM_MODEL。
  doubao_seedence_mini: ep-20260710100437-k7fw8
  # 豆包音频生成 v3 的非敏感能力配置。API Key 只由 KMS initContainer 注入。
  SEED_AUDIO_ENDPOINT: https://openspeech.bytedance.com/api/v3/tts/create
  SEED_AUDIO_MODEL: seed-audio-1.0
  # 速创(suchuang)图片通道:线上开着,本文件原先整组缺失。补上两个非密键。
  # ⚠️ SUCHUANG_API_KEY 是密钥,不进本文件;而且它【不在】
  # deploy/k8s/secret-init/main.go 的任何一张键清单里(五把必需键、三把注册键、
  # 五把可选 provider 键都没有它),所以走 KMS 也补不回来——真接线前
  # 得先改那个 Go 文件并重建 init 镜像。这条列进 PR 存疑项。
  SUCHUANG_GENERATION_ENABLED: "true"
  SUCHUANG_BASE_URL: https://api.wuyinkeji.com/api
  # MiniMax credentials only come from the KMS initContainer. FABLE-016
  # removed the runtime direct-call switch; retained values are inert assets.
  MINIMAX_API_HOST: https://api.minimaxi.com
  MINIMAX_GROUP_ID: ""
  MINIMAX_LLM_MODELS: ""
  MINIMAX_IMAGE_MODELS: ""
  MINIMAX_VIDEO_MODELS: ""
  MINIMAX_AUDIO_MODELS: ""
  MINIMAX_AUDIO_VOICE_ID: male-qn-qingse
  # Company newapi gateway remains inert until a deployment supplies its
  # reviewed HTTPS URL, exact aliases, KMS key, and explicit enable flag.
  NEWAPI_GENERATION_ENABLED: "false"
  NEWAPI_BASE_URL: ""
  NEWAPI_APPROVED_BASE_URL_SHA256: ""
  NEWAPI_GPT_IMAGE_MODELS: ""
  NEWAPI_GEMINI_IMAGE_MODELS: ""
  # Trusted-asset registration. Its optional AK/SK credentials never enter this
  # ConfigMap; the KMS initContainer injects them only when the complete
  # registration credential pair exists.
  #
  # Keep this "true": with it off, promoting a finalized image into the asset
  # library returns 503 seedance_asset_registration_disabled, and video
  # generation silently falls back to text-only references (wrong subject).
  SEEDANCE_ASSET_REGISTRATION_ENABLED: "true"
  SEEDANCE_ASSET_GROUP_ID: "group-20260803200140-z4xlx"
  SEEDANCE_ASSET_GROUP_NAME: 中文在线短剧素材
  SEEDANCE_ASSET_GROUP_DESCRIPTION: 中文在线 AI 短剧平台登记的图片参考素材
  # Must match the project the asset group actually lives in. Verified against
  # Ark OpenAPI 2026-08-07: GetAssetGroup with ProjectName "shortdrama" returns
  # the group; with "default" it returns 404 NotFound.group_id.
  SEEDANCE_ASSET_PROJECT_NAME: "shortdrama"
  SEEDANCE_ASSET_REGISTRATION_ENDPOINT: https://ark.cn-beijing.volcengineapi.com
  SEEDANCE_ASSET_REGISTRATION_REGION: cn-beijing
  # S56 test baseline: AI assisted draft/match is enabled and independently
  # capped. The Ark credential is injected only by the KMS init container.
  AI_GATEWAY_ENABLED: "true"
  AI_DAILY_CALL_LIMIT: "5000"
  # 52API 选题雷达默认关闭。TOPIC_RADAR_52API_KEY 是敏感键,不在 KMS 五键合同内;
  # 启用前须先扩展 secret-init 密钥清单(见 docs/deploy/live-vs-repo-diff.md 决策项)。
  TOPIC_RADAR_52API_ENABLED: "false"
  TOPIC_RADAR_52API_ENDPOINT: ""
  TOPIC_RADAR_52API_CELL_ID: ""
  TOPIC_RADAR_52API_SUB_CELL_ID: ""
  TOPIC_RADAR_52API_TIMEOUT_MS: "10000"
  # Pi 远程编排默认关闭。PI_REMOTE_API_TOKEN 同为敏感键,处理方式同上。
  PI_REMOTE_API_URL: ""
  PI_REMOTE_MODEL: ""
  TOS_BUCKET: drama-asset
  # 两个端点都跟随线上补上协议头(SDK 对 endpoint 形态敏感);
  # TOS_ENDPOINT 线上还带桶前缀,一并对齐。
  # env.ts:`tosEndpoint = TOS_SDK_ENDPOINT ?? TOS_ENDPOINT`,以 SDK 那个为准。
  TOS_ENDPOINT: https://drama-asset.tos-cn-beijing.volces.com
  TOS_SDK_ENDPOINT: https://tos-cn-beijing.volces.com
  TOS_PUBLIC_BASE_URL: https://drama-asset.tos-cn-beijing.volces.com
  # CDN 开通并完成缓存键验收后由环境 overlay 填写；空值安全回退到 TOS 展示域名。
  ASSET_MEDIA_DISPLAY_BASE_URL: ""
  TOS_REGION: cn-beijing
  # Test VKE and Milvus are in the same VPC. Use the private endpoint so
  # semantic retrieval does not depend on the managed public allowlist/NAT.
  # 主机不变(仍是同 VPC 私网 ivolces),只是跟随线上补上 http:// 协议头。
  # 客户端两种形态是否都认,本次没有实测——照抄线上是当前证据最强的选择。
  MILVUS_URI: "http://milvus-008wns5nrtu8.milvus.ivolces.com:19530"
  MILVUS_USER: "admin"
  MILVUS_COLLECTION_ASSET_ENTITY: asset_entity_vectors_v2
  MILVUS_COLLECTION_PROJECT_STORYBOARD: project_storyboard_vectors
