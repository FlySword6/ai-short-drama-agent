apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortdrama
  namespace: shortdrama
  labels:
    app.kubernetes.io/name: shortdrama
    app.kubernetes.io/component: ingress
  annotations:
    # DC 拍板:base 先 HTTP 上线,域名与证书后置。
    # HTTPS-443 不在这里改——prod overlay 另起一个 shortdrama-https Ingress 追加 443 监听
    # 并绑证书中心证书,与本 Ingress 共享同一个 ALBInstance;dev/test 保持纯 HTTP。
    ingress.vke.volcengine.com/loadbalancer-port: "80"
    ingress.vke.volcengine.com/loadbalancer-protocol: http
    # VCI has no backing ECS node. ClusterIP therefore requires ALB to
    # register the VPC-CNI Pod IP directly instead of a NodePort backend.
    ingress.vke.volcengine.com/loadbalancer-pass-through: "true"
spec:
  ingressClassName: shortdrama-alb
  rules:
    # 无域名阶段按 CLB 公网 IP 访问:不设 host,默认规则全匹配
    - http:
        paths:
          # 别写成 /*:VKE ALB Standard 直接拒收带通配符的 path,报
          # InvalidRules.Url.Malformed,规则建不起来 → 公网 503(这就是那次 503 的真因)。
          # 写 / 配下面的 pathType: Prefix,前缀匹配才让 /api 与 Vite 静态资源都进到 app。
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortdrama
                port:
                  number: 80
