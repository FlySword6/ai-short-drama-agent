apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortdrama
  namespace: shortdrama
  labels:
    app.kubernetes.io/name: shortdrama
    app.kubernetes.io/component: app
  annotations:
    shortdrama.zhongwen.com/release-commit: 508dfee9325d05a07c546cebd86b0d4ca0184ead
spec:
  replicas: 1
  revisionHistoryLimit: 10
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shortdrama
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortdrama
        app.kubernetes.io/component: app
      annotations:
        vke.volcengine.com/burst-to-vci: enforce
        shortdrama.zhongwen.com/release-commit: 508dfee9325d05a07c546cebd86b0d4ca0184ead
    spec:
      serviceAccountName: shortdrama-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: secret-fetcher
          image: shortdrama-prod-cn-beijing.cr.volces.com/shortdrama/kms-secret-init:v0.1.2-508dfee9325d05a07c546cebd86b0d4ca0184ead@sha256:4119b551ee0f64cc1930c811b77e50210f70446189c278fb7d09fa962bfed3ec
          imagePullPolicy: IfNotPresent
          command:
            - /shortdrama-kms-init
          args:
            - --secret-name
            # KMS 命名合同:shortdrama/{env}/{purpose}(docs/contracts/environment-governance.md)。
            # base 即 test 环境真源;dev/prod 由 overlays 各自改写。
            - shortdrama/test/runtime
            - --region
            - cn-beijing
            - --output
            - /run/shortdrama/production-secrets.sh
          envFrom:
            - configMapRef:
                name: shortdrama-runtime
          env:
            - name: VOLCENGINE_OIDC_ROLE_TRN
              value: trn:iam::2100701382:role/shortdrama-prod-kms-reader
            - name: VOLCENGINE_OIDC_TOKEN_FILE
              value: /var/run/secrets/vke.volcengine.com/irsa-tokens/token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/shortdrama
            - name: irsa-oidc-token
              mountPath: /var/run/secrets/vke.volcengine.com/irsa-tokens
              readOnly: true
            - name: temp
              mountPath: /tmp
        - name: vnext-secret-fetcher
          image: shortdrama-prod-cn-beijing.cr.volces.com/shortdrama/kms-secret-init:v0.1.2-508dfee9325d05a07c546cebd86b0d4ca0184ead@sha256:4119b551ee0f64cc1930c811b77e50210f70446189c278fb7d09fa962bfed3ec
          imagePullPolicy: IfNotPresent
          command:
            - /shortdrama-kms-init
          args:
            - --secret-name
            - shortdrama/test/vnext-runtime
            - --region
            - cn-beijing
            - --output
            - /run/shortdrama/vnext-secrets.sh
          envFrom:
            - configMapRef:
                name: shortdrama-runtime
          env:
            - name: VOLCENGINE_OIDC_ROLE_TRN
              value: trn:iam::2100701382:role/shortdrama-prod-kms-reader
            - name: VOLCENGINE_OIDC_TOKEN_FILE
              value: /var/run/secrets/vke.volcengine.com/irsa-tokens/token
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/shortdrama
            - name: irsa-oidc-token
              mountPath: /var/run/secrets/vke.volcengine.com/irsa-tokens
              readOnly: true
            - name: temp
              mountPath: /tmp
      containers:
        - name: app
          image: shortdrama-prod-cn-beijing.cr.volces.com/shortdrama/app:v0.1.2-508dfee9325d05a07c546cebd86b0d4ca0184ead@sha256:2ac9abe9b70b9bdd9d8c2c193d3bce3224bcf9fe07660e4ab7688b01bf70411a
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
          args:
            - -euo
            - pipefail
            - -c
            - |
              source /run/shortdrama/production-secrets.sh
              source /run/shortdrama/vnext-secrets.sh
              exec node dist/server.js
          envFrom:
            - configMapRef:
                name: shortdrama-runtime
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              # /ready checks DB connectivity, schema existence and an exact
              # migration-head match. Apply migrations before replacing image.
              path: /api/v1/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
          volumeMounts:
            - name: runtime-secrets
              mountPath: /run/shortdrama
              readOnly: true
            - name: runtime-data
              mountPath: /app/runtime
            - name: temp
              mountPath: /tmp
            - name: rds-ca
              mountPath: /etc/ssl/certs/volcengine-rds
              readOnly: true
      volumes:
        - name: runtime-secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: runtime-data
          emptyDir:
            sizeLimit: 4Gi
        - name: temp
          emptyDir:
            sizeLimit: 256Mi
        - name: irsa-oidc-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.volcengine.com
                  expirationSeconds: 3600
                  path: token
        - name: rds-ca
          configMap:
            name: shortdrama-rds-ca
            defaultMode: 292
