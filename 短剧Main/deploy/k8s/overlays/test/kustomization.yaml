apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# test = 当前唯一在运行的线上环境(shortdrama-main-test.col.com)。
# base 已携带 test 全部实值与 shortdrama 命名空间;本层只注入环境标签,不改任何值。
# 注意:不要在本层设置 namespace 字段——ALBInstance 是集群级 CRD,
# kustomize 的 namespace 变换会给它盖上命名空间字段,与线上既有对象形态不一致。
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: test
    includeSelectors: false
