# ALBInstance/IngressClass 是集群级对象;多环境同集群时必须按环境改名防互相劫持。
- op: replace
  path: /metadata/name
  value: shortdrama-prod-alb
- op: replace
  path: /spec/instanceID
  value: alb-bd02qpgmuubk8dv40on9qir1
# HTTPS-443 监听:火山引擎证书中心(certificateSource=cert_center)证书 cert-ba8e5c12729b478fbe6d0b895d31852a
- op: add
  path: /spec/listeners/-
  value:
    protocol: HTTPS
    port: 443
    certificateID: cert-ba8e5c12729b478fbe6d0b895d31852a
    certificateSource: cert_center
