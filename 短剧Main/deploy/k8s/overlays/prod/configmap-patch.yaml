apiVersion: v1
kind: ConfigMap
metadata:
  name: shortdrama-runtime
  namespace: shortdrama
  annotations:
    # 部署期证据回执挂在这里,不在 data 里——data 的键会被 envFrom 原样灌进 Pod
    # 环境变量,部署期的东西不该进运行时(#251)。prod 这四条已落实值(#200,带 sha256);
    # base 那份仍是 REPLACE_WITH_ 占位,verify-rendered.sh 对退回 data 的写法 fail-closed。
    shortdrama.zhongwen.com/rds-private-connectivity-evidence: docs/validation/release/v0.1.2/rds-private-connectivity-20260809.json@sha256:eddb9b234280cfc6228f25fb4a23e1291af4dc0b76e01e70ad36cc6d60bd31c3
    shortdrama.zhongwen.com/admin-bootstrap-evidence: docs/validation/release/v0.1.2/admin-bootstrap-20260809.json@sha256:d1f9466a597385db75752c1c41144b1d656477bc8ac31f291a3a3a1feb3da84d
    shortdrama.zhongwen.com/alb-pod-direct-access-preflight-evidence: docs/validation/release/v0.1.2/alb-pod-direct-access-preflight-20260809.json@sha256:3605eec979bfb87b485eabd769301445714ab781681af916525731f838955dab
    shortdrama.zhongwen.com/vci-pod-security-group-preflight-evidence: docs/validation/release/v0.1.2/vci-pod-security-group-preflight-20260809.json@sha256:ec9e347e9c6771f0d409beda40bb860506e8ad1687cff4ffbf76c723c399fc76
data:
  APP_NAME: Shortdrama Prod
  # 同一账号只留一处登录:生产开。base 是测试环境、写的是 false,这里必须覆盖回来。
  AUTH_SINGLE_ACTIVE_SESSION: "true"
  # AI 网关保持默认关闭，额度需另行裁决后再改。
  # 2026-08-12 更正：本行原以「prod 尚未开通」作理由，那句已过期（生产在跑）；
  # 但关闭这个决定本身没有被推翻，改它仍要另行裁决。
  AI_GATEWAY_ENABLED: "false"
  AI_DAILY_CALL_LIMIT: "200"
  # prod 独立实例的实值(v0.1.2 定版落地)。这几个键绝不允许继承 base 的 test 实值。
  POSTGRES_HOST: postgresc96136f95067.rds-pg.ivolces.com
  POSTGRES_USER: shortdrama_prod
  # Day-0 首位管理员（修订 2026-07-24：username=admin，账密真源 KMS shortdrama/production-admin）
  ADMIN_USERNAMES: admin
  MILVUS_URI: http://milvus-00ggc6mgzi59.milvus.ivolces.com:19530
  VKE_TARGET_ID: cd9s5n7d110eqluoq27bg
  # 同 dev:base 的 disable 只对 test 那个没挂 CA 的历史 Pod 成立,prod 钉死目标态。
  POSTGRES_SSL_MODE: verify-full
