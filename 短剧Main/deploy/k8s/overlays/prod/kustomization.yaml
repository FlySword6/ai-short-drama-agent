apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# prod overlay。2026-08-12 更正:原注释写「骨架、独立实例未开通、占位待换」,#289
# 合入后已过期——本目录不再有 REPLACE_WITH_* 占位,RDS/Milvus/ALB/证书都是 prod
# 专属实值(不是 base 的 test 值)。verify-rendered.sh 对含占位的渲染结果 fail-closed。
#
# 仍未闭合的两件,别拿本注释当结论:①「prod 实例是否真的与 test 隔离」只有仓库侧
# 证据,没有生产侧实读,口径见 docs/contracts/environment-governance.md §0;
# ②入口还是明文 HTTP,80 跳 443 没有落进清单,见 issue #318。
namespace: shortdrama-prod
resources:
  - ../../base
  - ingress-https.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
  - path: alb-instance-patch.yaml
    target:
      kind: ALBInstance
      name: shortdrama-alb
  - path: ingress-patch.yaml
