# HTTPS-443 入口:与 shortdrama(HTTP-80)共享同一 ALBInstance,规则挂到 HTTPS:443 listener。
# 证书绑定在 ALBInstance listener(证书中心 cert_center),Ingress 仅按 protocol/port 匹配 listener。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shortdrama-https
  labels:
    app.kubernetes.io/name: shortdrama
    app.kubernetes.io/component: ingress
  annotations:
    # VCI has no backing ECS node. ClusterIP therefore requires ALB to
    # register the VPC-CNI Pod IP directly instead of a NodePort backend.
    ingress.vke.volcengine.com/loadbalancer-pass-through: "true"
    ingress.vke.volcengine.com/loadbalancer-port: "443"
    ingress.vke.volcengine.com/loadbalancer-protocol: https
spec:
  ingressClassName: shortdrama-prod-alb
  rules:
    # 无域名阶段按 ALB 公网 IP 访问:不设 host,默认规则全匹配
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shortdrama
                port:
                  number: 80
