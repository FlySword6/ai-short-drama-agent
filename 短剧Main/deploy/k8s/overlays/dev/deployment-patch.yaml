apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortdrama
  namespace: shortdrama
spec:
  template:
    spec:
      initContainers:
        - name: secret-fetcher
          # KMS 命名合同 shortdrama/{env}/{purpose};args/env 列表为整体替换,
          # 未改动的项必须与 base/deployment.yaml 保持一致。
          args:
            - --secret-name
            - shortdrama/dev/runtime
            - --region
            - cn-beijing
            - --output
            - /run/shortdrama/production-secrets.sh
          env:
            - name: VOLCENGINE_OIDC_ROLE_TRN
              value: REPLACE_WITH_DEV_IRSA_ROLE_TRN
            - name: VOLCENGINE_OIDC_TOKEN_FILE
              value: /var/run/secrets/vke.volcengine.com/irsa-tokens/token
