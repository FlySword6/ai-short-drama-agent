apiVersion: v1
kind: ConfigMap
metadata:
  name: shortdrama-runtime
  namespace: shortdrama
data:
  APP_NAME: Shortdrama Dev
  # base 是 test 真源；未单独裁决前，集群 dev 不继承 test 的 AI 开启状态。
  AI_GATEWAY_ENABLED: "false"
  AI_DAILY_CALL_LIMIT: "200"
  # 企业微信 dev 非密配置。回调地址和独立 dev CorpSecret 就绪前保持关闭；
  # CorpSecret 只能来自 shortdrama/dev/runtime，绝不进入本 ConfigMap。
  WECOM_LOGIN_ENABLED: "false"
  WECOM_CORP_ID: ww403b31a2be286507
  WECOM_AGENT_ID: "1000002"
  # 以下键若直接继承 base 的 test 实值会把 dev 流量打进 test 依赖,占位 fail-closed。
  # 与 test 同集群联调时 VKE_TARGET_ID 可继承 base;独立集群时再覆盖。
  POSTGRES_HOST: REPLACE_WITH_DEV_RDS_HOST
  POSTGRES_USER: REPLACE_WITH_DEV_DB_USER
  MILVUS_URI: REPLACE_WITH_DEV_MILVUS_URI
  # base 的 disable 是给 test 那个没挂 CA 的历史 Pod 的,不该传染给 dev。
  # dev 没有历史 Pod,只会走整包部署(带 rds-ca 卷 + secret-init),钉死目标态。
  POSTGRES_SSL_MODE: verify-full
