apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# dev 集群联调骨架。本地开发主战场是 docker compose(见 docker-compose.dev.yml),
# 本层仅为集群联调预留。开通前必须把全部 REPLACE_WITH_* 占位换成 dev 实值;
# verify-rendered.sh 对含占位的渲染结果 fail-closed。
namespace: shortdrama-dev
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: dev
    includeSelectors: false
patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
  - path: alb-instance-patch.yaml
    target:
      kind: ALBInstance
      name: shortdrama-alb
  - path: ingress-patch.yaml
