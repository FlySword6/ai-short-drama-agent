<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eeeae2; }
      #preview { display: block; width: 512px; height: 512px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="preview" width="512" height="512"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      window.renderResult = null;
      window.renderError = null;

      async function render() {
        const asset = new URL(location.href).searchParams.get("asset");
        if (!asset || !asset.startsWith("/asset/")) throw new Error("asset path is missing");
        const canvas = document.querySelector("#preview");
        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: false,
          preserveDrawingBuffer: true,
          powerPreference: "high-performance"
        });
        renderer.setPixelRatio(1);
        renderer.setSize(512, 512, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color("#eeeae2");
        scene.add(new THREE.HemisphereLight("#fff7e8", "#6d746b", 2.2));
        const key = new THREE.DirectionalLight("#fff5e6", 3.4);
        key.position.set(4, 6, 5);
        scene.add(key);
        const fill = new THREE.DirectionalLight("#bfd6ff", 1.2);
        fill.position.set(-5, 2, 3);
        scene.add(fill);

        const gltf = await new GLTFLoader().loadAsync(asset);
        const root = gltf.scene;
        root.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = false;
            node.receiveShadow = false;
            node.frustumCulled = false;
          }
        });
        scene.add(root);

        let box = new THREE.Box3().setFromObject(root);
        if (box.isEmpty()) throw new Error("GLB has no renderable bounds");
        const center = box.getCenter(new THREE.Vector3());
        root.position.sub(center);
        box = new THREE.Box3().setFromObject(root);
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        if (!Number.isFinite(sphere.radius) || sphere.radius <= 0) throw new Error("GLB bounds are invalid");

        const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 10_000);
        const distance = sphere.radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.18;
        camera.position.set(1.55, 1.05, 2.05).normalize().multiplyScalar(distance);
        camera.near = Math.max(0.001, distance / 100);
        camera.far = Math.max(100, distance * 10);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();

        renderer.render(scene, camera);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        renderer.render(scene, camera);
        window.renderResult = {
          width: 512,
          height: 512,
          radius: sphere.radius,
          triangles: renderer.info.render.triangles
        };
      }

      render().catch((error) => {
        window.renderError = error instanceof Error ? error.message : "render failed";
      });
    </script>
  </body>
</html>
