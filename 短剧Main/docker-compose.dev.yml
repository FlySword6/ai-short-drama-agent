# 本地开发依赖（用法见 docs/dev/local-environment.md）。
#
# 这里只起 PostgreSQL 14：与云上 RDS 的 PG14 行为对齐（不要用 16，行为有差异，
# 定策见 docs/proposals/pg14-vs-pg16-decision.md）。应用本身在本机用 `npm run dev`
# 跑，便于改代码热重载。Milvus 故意不起：向量检索是可重建投影，dev 下走
# PostgreSQL 降级路径（src/modules/assets/searchFailover.ts）。
#
# 数据卷 shortdrama-dev-postgres 只服务本机，`npm run dev:reset` 一键清空重开，
# 与任何云资源无关。

name: shortdrama-dev-2

services:
  db:
    image: postgres:14-alpine
    environment:
      # 只接受本机 .env 里的 dev 值；dev:up 的护栏会先拒绝云端目标。
      POSTGRES_USER: ${POSTGRES_USER:?请先在 .env 配置 POSTGRES_USER（可直接 npm run dev:up 生成）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 配置 POSTGRES_PASSWORD（dev 占位密码即可）}
      POSTGRES_DB: ${POSTGRES_DB:?请先在 .env 配置 POSTGRES_DB}
    ports:
      - "${SHORTDRAMA_DEV_PG_PORT:-5432}:5432"
    volumes:
      - shortdrama-dev2-postgres:/var/lib/postgresql/data
      # 首次建卷时安装 pg_trgm（迁移 017 的硬前置，缺了迁移链 fail-closed）。
      - ./scripts/dev-pg-init.sql:/docker-entrypoint-initdb.d/00-dev-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    restart: unless-stopped

volumes:
  shortdrama-dev2-postgres:
