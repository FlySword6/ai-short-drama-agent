name: 需求卡
description: 提一件要做的事(新功能、改动、体验问题)。四段填完就能派单。
title: "[需求] "
body:
  - type: markdown
    attributes:
      value: |
        四段都填完,这张卡才能派出去。**不懂开发的人也应该能看懂每一段**——
        看不懂就说明写得太技术了,换成人话重写。

        写之前先看一眼 [CONTRIBUTING.md](https://github.com/col-shortdrama/zhongwen-shortdrama-main/blob/dev/CONTRIBUTING.md):有一批词在我们这儿是禁用的。

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 不解决不部署/生产事故
        - P1 当前迭代必须
        - P2 排队
        - P3 机会性
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 类型
      options:
        - 缺陷
        - 功能
        - 部署
        - 治理
        - 调研
        - 经验沉淀
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: 归属组
      options:
        - col 平台工程
        - vNext
        - test 链
        - coding-environment
        - 资产库
        - 产品定义
        - 待分诊
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 用人话讲这件事为什么要做。现在是什么样、谁被卡住了、不做会怎样。
      placeholder: |
        例:导演在分镜页想改一个镜头的提示词,现在要退回上一页重新进,一次改三个镜头要来回跳六次。
        走查时被点名两次了。
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 站在用户角度写一句话。不写技术方案,只写用户能做成什么。
      placeholder: |
        例:导演能在分镜页当场改提示词并保存,不用离开这一页。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: |
        编号列出来,一条一行。每条都要**能被不懂开发的人照着核对**——
        写"点哪里、看到什么",不要写"接口返回 200""组件已实现"。
      placeholder: |
        1. 在分镜页点任意一个镜头,提示词是可以直接编辑的输入框,不是只读文字。
        2. 改完点保存,页面上当场看到新内容,不刷新也不跳页。
        3. 保存后刷新浏览器,改的内容还在。
        4. 网断了点保存,出现一句中文提示告诉我没保存成功,内容不丢。
        5. 没有编辑权限的人打开,看到的是只读文字,没有保存按钮。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 边界与依赖
      description: |
        **这一单不做什么**(免得越做越大),以及**它得等谁**。
        不确定会不会和别人撞车,先查 `docs/planning/file-ownership-map.md`,撞了就在这里写一句。
      placeholder: |
        不做:批量改多个镜头(另开一张卡)、提示词的 AI 补全。
        依赖:要等后端的分镜保存接口(#31)先合并。
        文件面:会动 segment-workbench 这一族的文件,和当前在改这块的人重了,已在评论里说过一声。
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        机器对账用的锚点(版本计划的 `card:` 锚、看板的 `external_id`、里程碑、负责人标签)由统筹补,提卡的人不用管。
