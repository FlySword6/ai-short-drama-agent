name: 报个问题
description: 界面不对、点了没反应、报错、数据不对——都用这个。
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        **不用先搞清楚原因**,把你看到的照实写下来就够了,剩下的我们查。

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 不解决不部署/生产事故
        - P1 当前迭代必须
        - P2 排队
        - P3 机会性
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 类型
      options:
        - 缺陷
        - 功能
        - 部署
        - 治理
        - 调研
        - 经验沉淀
    validations:
      required: true

  - type: dropdown
    id: team
    attributes:
      label: 归属组
      options:
        - col 平台工程
        - vNext
        - test 链
        - coding-environment
        - 资产库
        - 产品定义
        - 待分诊
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: 在哪个页面
      description: 页面名字 + 地址栏里的链接(有的话)。
      placeholder: 例:分镜页 /projects/12/episodes/3/segments
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 用一句话说明你看到的现象、谁被影响，以及为什么需要处理。
      placeholder: |
        例:点"保存"以后按钮一直转圈,大概十秒后弹出一句"操作失败,请重试",改的内容没保存上。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 怎么重现
      description: 一步一行,从打开哪个页面开始写。别人照着走要能撞到同样的问题。
      placeholder: |
        1. 用 admin 登录测试环境
        2. 打开项目"测试剧 A" → 第 3 集
        3. 点第 2 个镜头,把提示词改成任意内容
        4. 点保存
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 两句话说明修好后怎样核对，以及现在的实际结果。
      placeholder: |
        期望:保存成功,提示词变成新内容。
        实际:转圈十秒后报失败,内容退回原样。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图 / 录屏
      description: |
        直接把图片拖进这个框就能上传。**报错的那一屏最有用**,整个窗口都拍进去(带地址栏)。
        录屏也行。没有就写"无"。
      placeholder: 把截图拖到这里
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 你在哪个环境撞到的
      description: 测试环境 / 本机 / 线上,浏览器是什么。不确定就写不确定。
      placeholder: 例:测试环境,Chrome,macOS
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 有多挡路
      options:
        - 挡住了,这条路完全走不下去
        - 有绕的办法,但很难受
        - 不挡事,看着别扭
    validations:
      required: true
