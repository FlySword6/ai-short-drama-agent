name: Issue form governance

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-form-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  classify:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-22.04
    steps:
      - name: Validate form fields and synchronize labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const issue = context.payload.issue;
            const governanceMarker = "<!-- issue-form-governance -->";
            const contractMarker = "devbox-dispatch-contract";

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const isAgentContract =
              (issue.body || "").includes(contractMarker) ||
              comments.some((comment) => (comment.body || "").includes(contractMarker));
            const governanceComment = comments.find((comment) =>
              (comment.body || "").includes(governanceMarker),
            );

            if (isAgentContract) {
              const currentLabels = (issue.labels || []).map((label) =>
                typeof label === "string" ? label : label.name,
              );
              if (currentLabels.includes("needs-triage")) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "needs-triage" });
              }
              if (governanceComment) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: governanceComment.id });
              }
              core.info("Agent contract issue: form validation skipped.");
              return;
            }

            function section(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = (issue.body || "").match(
                new RegExp(`(?:^|\\n)### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`),
              );
              if (!match) return "";
              const value = match[1].trim();
              return value === "_No response_" || value === "No response" ? "" : value;
            }

            const values = {
              priority: section("优先级"),
              type: section("类型"),
              team: section("归属组"),
              context: section("背景"),
              acceptance: section("验收"),
            };
            const mappings = {
              priority: {
                "P0 不解决不部署/生产事故": "priority:P0",
                "P1 当前迭代必须": "priority:P1",
                "P2 排队": "priority:P2",
                "P3 机会性": "priority:P3",
              },
              type: {
                "缺陷": "type:bug",
                "功能": "type:feature",
                "部署": "type:deploy",
                "治理": "type:governance",
                "调研": "type:research",
                "经验沉淀": "type:lessons",
              },
              team: {
                "col 平台工程": "team:col",
                "vNext": "team:vnext",
                "test 链": "team:test",
                "coding-environment": "team:devbox",
                "资产库": "team:assets",
                "产品定义": "team:product",
                "待分诊": "team:triage",
              },
            };
            const labelDefinitions = {
              "needs-triage": ["ededed", "表单字段缺失或不合法"],
            };

            const selected = [
              mappings.priority[values.priority],
              mappings.type[values.type],
              mappings.team[values.team],
            ];
            const missing = [];
            if (!selected[0]) missing.push("优先级");
            if (!selected[1]) missing.push("类型");
            if (!selected[2]) missing.push("归属组");
            if (!values.context) missing.push("背景");
            if (!values.acceptance) missing.push("验收");

            async function ensureLabel(name) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                const [color, description] = labelDefinitions[name];
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            const currentLabels = (issue.labels || []).map((label) =>
              typeof label === "string" ? label : label.name,
            );
            // 表单重校验只拥有 needs-triage。team/type/priority 以及其它流程标签
            // 由人工或各自工作流管理；评论/正文编辑不得借校验失败把它们剥掉。
            const managed = (name) => name === "needs-triage";
            const desired = missing.length === 0 ? [] : ["needs-triage"];

            for (const name of desired) await ensureLabel(name);
            for (const name of currentLabels.filter((name) => managed(name) && !desired.includes(name))) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            const toAdd = desired.filter((name) => !currentLabels.includes(name));
            if (toAdd.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: toAdd });
            }

            if (missing.length > 0) {
              const body = `${governanceMarker}\n请补齐或修正以下表单字段：${missing.join("、")}。完成后编辑本 Issue，系统会重新校验并同步标签。`;
              if (governanceComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: governanceComment.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } else if (governanceComment) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: governanceComment.id });
            }
