name: ci-health-watch

on:
  workflow_run:
    workflows:
      - v011-required-checks
    types:
      - completed
    branches:
      - dev
  schedule:
    # 兜底节奏对齐 scripts/ci/ci-health-watch.mjs 里写明的响应口径
    # 「工作时段 30 分钟内认领」——真实信号来自上面的 workflow_run(CI 一跑完就归并),
    # 这条 cron 只接住 workflow_run 丢事件的情况,不该比认领窗口更密。
    # 原来是 */15:2026-08-01~17 触发 729 次,每次 1 个 job 撞 Actions 的 1 分钟
    # 计费地板,约一半是「没有新事实时再确认一遍」。
    # 分钟数错开 :00/:30:GitHub 在整点与半点排队最挤,丢调度最多。
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      synthetic_state:
        description: "live 读取真实 dev CI；其余值只操作独立的合成验收 issue"
        required: true
        default: live
        type: choice
        options:
          - live
          - red
          - green
          - not_assessable
      synthetic_signature:
        description: "合成 red 的错误摘要；不得填写凭据"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-health-watch-dev
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 归并 dev CI 健康状态
        uses: actions/github-script@v9
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.workflow_sha }}
          SYNTHETIC_STATE: ${{ inputs.synthetic_state || 'live' }}
          SYNTHETIC_SIGNATURE: ${{ inputs.synthetic_signature || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "scripts/ci/ci-health-watch.mjs",
              ref: process.env.WORKFLOW_SOURCE_SHA,
            });
            if (Array.isArray(response.data) || response.data.type !== "file" || !response.data.content) {
              core.setFailed("无法读取 ci-health-watch 状态归并脚本");
              return;
            }
            const fs = require("node:fs");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const source = Buffer.from(response.data.content, "base64").toString("utf8");
            const modulePath = path.join(process.env.RUNNER_TEMP, `ci-health-watch-${Date.now()}.mjs`);
            fs.writeFileSync(modulePath, source, { encoding: "utf8", mode: 0o600 });
            const watcher = await import(pathToFileURL(modulePath).href);
            await watcher.run({
              github,
              context,
              core,
              inputs: {
                synthetic_state: process.env.SYNTHETIC_STATE,
                synthetic_signature: process.env.SYNTHETIC_SIGNATURE,
              },
            });
