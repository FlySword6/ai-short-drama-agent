name: trigger-prod-pipeline-on-main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prod-pipeline-trigger
  cancel-in-progress: false

jobs:
  trigger-vcd:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 触发 VCD 生产流水线
        env:
          VCD_WEBHOOK_URL: ${{ secrets.VCD_PIPELINE_WEBHOOK_URL }}
          PIPELINE_REPOSITORY: ${{ github.repository }}
          PIPELINE_REF: ${{ github.ref }}
          PIPELINE_BRANCH: ${{ github.ref_name }}
          PIPELINE_COMMIT: ${{ github.sha }}
          PIPELINE_ACTOR: ${{ github.actor }}
          PIPELINE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${VCD_WEBHOOK_URL:-}" ]; then
            echo "::error::缺少 secret VCD_PIPELINE_WEBHOOK_URL，无法触发生产流水线"
            exit 1
          fi

          payload="$(
            jq -cn \
              --arg repository "$PIPELINE_REPOSITORY" \
              --arg ref "$PIPELINE_REF" \
              --arg branch "$PIPELINE_BRANCH" \
              --arg commit "$PIPELINE_COMMIT" \
              --arg actor "$PIPELINE_ACTOR" \
              --arg run_id "$PIPELINE_RUN_ID" \
              '{repository: $repository, ref: $ref, branch: $branch, commit: $commit, actor: $actor, run_id: $run_id}'
          )"

          echo "main 分支 push (${PIPELINE_COMMIT:0:12}) -> 触发 VCD 生产流水线"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data-binary "$payload" \
            "$VCD_WEBHOOK_URL"
