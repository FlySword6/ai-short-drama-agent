name: Product E2E

on:
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: Why this product E2E run was requested
        required: false
        default: manual
        type: string
      allow_paid_generation:
        description: Run one paid test-environment generation within the configured cap
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: product-e2e-test
  cancel-in-progress: false

jobs:
  test:
    name: Browser, CLI and UX product gate
    runs-on: ubuntu-22.04
    environment: test
    timeout-minutes: 90
    env:
      E2E_TRIGGER_REASON: ${{ github.event_name == 'schedule' && 'daily' || inputs.trigger_reason }}
      E2E_TARGET_ENVIRONMENT: test
      SGOAL06_BASE_URL: https://shortdrama-main-test.col.com
      SGOAL07_ASSET_EXPERIENCE_BASE_URL: https://shortdrama-main-test.col.com
      SHORTDRAMA_API_BASE: https://shortdrama-main-test.col.com
      CLI_E2E_TARGET_ENVIRONMENT: test
      TEST_ENV_ADMIN_USERNAME: ${{ secrets.TEST_ENV_ADMIN_USERNAME }}
      TEST_ENV_ADMIN_PASSWORD: ${{ secrets.TEST_ENV_ADMIN_PASSWORD }}
      CLI_E2E_USERNAME: ${{ secrets.TEST_ENV_ADMIN_USERNAME }}
      SHORTDRAMA_PASSWORD: ${{ secrets.TEST_ENV_ADMIN_PASSWORD }}
      CLI_E2E_ALLOW_PAID_GENERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_paid_generation && 'true' || 'false' }}
      MIDSCENE_MODEL_BASE_URL: https://ark.cn-beijing.volces.com/api/v3
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: doubao-seed-2.1-turbo
      MIDSCENE_MODEL_FAMILY: doubao-seed
      GH_TOKEN: ${{ secrets.CLI_E2E_REPO_TOKEN }}
    steps:
      - name: Check out main service
        uses: actions/checkout@v5

      - name: Verify product-gate secrets
        shell: bash
        run: |
          for name in TEST_ENV_ADMIN_USERNAME TEST_ENV_ADMIN_PASSWORD MIDSCENE_MODEL_API_KEY GH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::产品自动化缺少必需 secret：${name}"
              exit 1
            fi
          done

      - name: Resolve current CLI Release
        id: cli_release
        shell: bash
        run: |
          release_tag="$(gh release view --repo col-shortdrama/zhongwen-shortdrama-cli --json tagName --jq .tagName)"
          test -n "${release_tag}"
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "CLI_E2E_RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"

      - name: Check out exact released CLI source
        uses: actions/checkout@v5
        with:
          repository: col-shortdrama/zhongwen-shortdrama-cli
          ref: ${{ steps.cli_release.outputs.tag }}
          path: cli-repository
          token: ${{ secrets.CLI_E2E_REPO_TOKEN }}

      - name: Set up Node 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install main and CLI locked dependencies
        run: |
          npm ci
          python -m pip install "uv==0.7.13"
          uv sync --frozen --project cli-repository
          npx playwright install --with-deps chromium

      - name: Run the complete product report
        env:
          E2E_CLI_REPOSITORY_DIR: ${{ github.workspace }}/cli-repository
          E2E_CLI_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/cli-product-e2e
        run: npm run e2e:product:report

      - name: Upload report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-e2e-${{ github.run_id }}
          path: |
            outputs/e2e-reports/
            artifacts/
            test-results/
          if-no-files-found: warn
