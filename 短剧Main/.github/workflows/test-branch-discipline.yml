# `test` 分支纪律门禁。判据出处:docs/adr/0004-test-branch-downstream-only.md
#
# 单独一个 workflow,不并进 v011-required-checks:那边的 job 是 dev/PR 的
# required check 上下文,这道门只在 test 上有意义,混在一起会让两边的
# required 名单互相牵连。
#
# 不装依赖:脚本只用 node 内置模块,node 22.19.0 直接跑 .mts(type stripping)。
# 已在 CI 同版镜像里实测过。所以这道门是秒级的,不会变成又一道重到想绕的关。
name: test-branch-discipline

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

permissions:
  contents: read

concurrency:
  group: test-branch-discipline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discipline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # git cherry 要算 patch-id 和 merge-base,浅克隆不够。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
      - name: Fetch dev and test refs
        run: git fetch origin dev test --no-tags
      - name: Check test branch discipline
        run: npm run check:test-branch-discipline
