name: v011-required-checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: v011-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A 快线：保留 job id `verify`，不打断现有 required-check 上下文。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Verify package-lock consistency
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --exit-code -- package-lock.json; then
            echo '::error title=package-lock.json is stale::Dependency manifests and package-lock.json are out of sync. Rebuild with CI npm in Docker: docker run --rm -v "$PWD:/w" -w /w node:22.19.0 npm install --package-lock-only --ignore-scripts --no-audit --no-fund'
            exit 1
          fi
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libimage-exiftool-perl ripgrep
          ffmpeg -version
          exiftool -ver
          rg --version
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce architecture contract
        run: npm run check:architecture
      - name: Verify director mirror
        run: npm run check:director-mirror
      - name: Typecheck
        run: npm run typecheck
      - name: Test Node fast lane
        run: npm run test:node
      - name: Build
        run: npm run build

  # Issue #26 must prove its real registration-to-quote path before merge.
  # Keep this PR lane narrow; the existing dev-push lane below remains the
  # whole PostgreSQL regression suite.
  verify-ops-p0-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test operations P0 real PostgreSQL path
        run: npm run test:ops-p0-db

  # Issue #28 protects both control-package writes and the final paid-provider
  # boundary with real PostgreSQL locks/triggers. Keep its PR proof independent
  # so a skipped local Docker run cannot be mistaken for acceptance.
  verify-reference-review-gate-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install AIGC labeling runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimage-exiftool-perl
          exiftool -ver
      - name: Install locked dependencies
        run: npm ci
      - name: Test reference review gate real PostgreSQL path
        run: npm run test:reference-review-gate-db

  # Issue #157 publishes 70 paid image combinations through migrations 056/057.
  # Run the real PostgreSQL replay before merge so seed parity, drift rejection
  # and transaction rollback are not deferred until the dev push lane.
  verify-suchuang-pricing-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test #157 image pricing migrations on PostgreSQL
        run: npm run test:audio-pricing-seed-db

  # CLI 付费红线必须在 PR 上自建真 PostgreSQL；外部共享数据库或仅 dev-push 回放都不算闸。
  verify-generation-quotes-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install AIGC labeling runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimage-exiftool-perl
          exiftool -ver
      - name: Install locked dependencies
        run: npm ci
      - name: Test generation quote paid redlines on PostgreSQL
        run: npm run test:generation-quotes-db

  # Issue #150 reserves the one approved test-environment paid smoke before
  # provider submission. Prove the unique reservation against real PostgreSQL
  # on every PR so an ephemeral/local-only ledger cannot regress unnoticed.
  verify-tier-smoke-ledger-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test tier smoke durable reservation
        run: npm run test:tier-smoke-ledger-db

  # S72B 修复会改写定价规则；它有独立的回滚与幂等语义，不能只在 test:node 里跳过。
  verify-s72-repair-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test S72 repair real PostgreSQL path
        run: npm run test:s72-repair-db

  # ↓ #284：以下 6 个套件此前在 CI 上一次都没跑过——PR 不跑，合进 dev 也不跑。
  # 本机 `npm test` 会跑到它们（有 docker 的话），CI 页面上一片绿，两边都没有信号
  # 说「这一批在 CI 上是空的」。`scripts/check-ci-db-coverage.mts` 守住第 18 个。
  # timeout 一律给 20 分钟：这批没有任何 CI 实测耗时数据，卡太紧只会红在错的地方。

  # #240 那一刀改了 tests/script-breakdown-db.test.ts 145 行，CI 一次都没碰过。
  verify-script-breakdown-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test script breakdown real PostgreSQL path
        run: npm run test:script-breakdown-db

  verify-asset-media-repair-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test asset media repair real PostgreSQL path
        run: npm run test:asset-media-repair-db

  verify-trash-retention-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test trash retention real PostgreSQL path
        run: npm run test:trash-retention-db

  verify-generation-failed-list-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test generation failed list real PostgreSQL path
        run: npm run test:generation-failed-list-db

  # 这批里最厚的一个，约 14 条。
  verify-volc-asset-registration-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test volc asset registration real PostgreSQL path
        run: npm run test:volc-asset-registration-db

  # 跨租户越权是安全面，这条尤其不该只在本机跑过。
  verify-review-cross-tenant-authz-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test review cross-tenant authorization real PostgreSQL path
        run: npm run test:review-cross-tenant-authz-db

  # main#292 抽卡任务「表与读」:迁移 061 + 开单/列单/看单/改单的真 PostgreSQL
  # 路由测试必须在 PR 车道当闸——只进 dev-push 的 verify-postgres 挡不住 PR。
  verify-casting-tasks-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test casting tasks on PostgreSQL
        run: npm run test:casting-tasks-db

  # Issue #308 keeps vNext facts on the isolated runtime role while AI audit
  # and model capability reads use the main application database.
  verify-vnext-script-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test vNext script split-role persistence on PostgreSQL
        run: npm run test:vnext-script-db

  # Issue #309 proves Snapshot A's immutable mapping, exactly-once controlled
  # registration intent, recovery, and legacy-library isolation on PostgreSQL.
  verify-vnext-assets-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build frontend for browser E2E
        run: npm run build:frontend
      - name: Test vNext Snapshot A assets on PostgreSQL
        run: npm run test:vnext-assets-db
      - name: Run contracted vNext assets API seam E2E
        run: npm run e2e:vnext-assets

  # Issue #427 changes identity mapping, replay protection and session
  # issuance. This PR job is the merge-blocking PostgreSQL evidence; the
  # dev-push aggregate below remains the post-merge integration safety net.
  verify-wecom-auth-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test WeCom authentication foundation on PostgreSQL
        run: npm run test:wecom-auth-db

  # S69「永久删除不能误删共享对象、向量键要清干净」原本混在 test:node 里，
  # 于是每个 PR 都跟着 A 快线真跑过（GitHub runner 自带 Docker，该用例没有 skip 分支）。
  # 2026-08-12 把它移出快线，这条 PR 闸接住原有的触发面——只留 dev push 会让 PR
  # 少一层删除完整性防线，那正是 check-ci-db-coverage 要拦的「合进去之后才跑」。
  verify-s69-storage-deletion-postgres:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test S69 storage deletion integrity PostgreSQL
        run: npm run test:s69-storage-deletion-db

  # #334 P0 批次(issue #371):16 个孤儿真 PG 测试文件此前在 CI 上一次都没跑过。
  # 聚合入口 test:p0-orphan-db 串行跑 16 个子 runner,每个各自起一次性
  # postgres:14-alpine 容器;任一失败即整体失败。
  verify-p0-orphan-db-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test P0 orphan real PostgreSQL suites
        run: npm run test:p0-orphan-db

  # B 集成线：真 PostgreSQL 段只在 dev push 必跑，与 A 快线并行。
  verify-postgres:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libimage-exiftool-perl ripgrep
          ffmpeg -version
          exiftool -ver
          rg --version
      - name: Install locked dependencies
        run: npm ci
      - name: Test S67 PostgreSQL
        run: npm run test:s67-db
      - name: Test S84 PostgreSQL
        run: npm run test:s84-db
      - name: Test tier smoke reservation PostgreSQL
        run: npm run test:tier-smoke-ledger-db
      - name: Test Seed Audio PostgreSQL
        run: npm run test:seed-audio-db
      - name: Test Object Context PostgreSQL
        run: npm run test:object-context-db
      - name: Test Asset Usage PostgreSQL
        run: npm run test:asset-usage-db
      - name: Test Reference Review Gate PostgreSQL
        run: npm run test:reference-review-gate-db
      - name: Test Generation Quote Paid Redlines PostgreSQL
        run: npm run test:generation-quotes-db
      - name: Test Agent Credential Source PostgreSQL
        run: npm run test:agent-credential-source-db
      - name: Test S69 storage deletion integrity PostgreSQL
        run: npm run test:s69-storage-deletion-db
      # 「生产仍然只留一处登录」这条口径必须在真 PostgreSQL 上被钉住,
      # 不能只靠本地跑一次——本地没有 docker 时 runner 会显式跳过。
      - name: Test login session policy PostgreSQL
        run: npm run test:auth-single-active-session-db
      - name: Test WeCom authentication foundation PostgreSQL
        run: npm run test:wecom-auth-db
      # ↓ #284 这 6 个上面已各有一个 PR 闸 job。这里再跑一遍不是重复:
      # PR 各自绿不等于合起来绿,dev push 是多条 PR 汇合后的第一道真检查。
      # 现有约定就是两处都有——test:tier-smoke-ledger-db 与
      # test:reference-review-gate-db 本来就是 PR 闸与本 job 各一次。
      - name: Test Script Breakdown PostgreSQL
        run: npm run test:script-breakdown-db
      - name: Test Asset Media Repair PostgreSQL
        run: npm run test:asset-media-repair-db
      - name: Test Trash Retention PostgreSQL
        run: npm run test:trash-retention-db
      - name: Test Generation Failed List PostgreSQL
        run: npm run test:generation-failed-list-db
      - name: Test Volc Asset Registration PostgreSQL
        run: npm run test:volc-asset-registration-db
      - name: Test Review Cross Tenant Authz PostgreSQL
        run: npm run test:review-cross-tenant-authz-db
      - name: Test Casting Tasks PostgreSQL
        run: npm run test:casting-tasks-db
