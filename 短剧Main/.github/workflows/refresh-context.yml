name: receive-source-notification

on:
  workflow_dispatch:
    inputs:
      contextSha:
        description: "Full commit SHA from zhongwen-shortdrama-context@main"
        required: false
        type: string
      evalSha:
        description: "Full commit SHA from zhongwen-shortdrama-eval@main"
        required: false
        type: string
# Route A is notification-only until this repository defines context/eval consumers.
# This receiver does not reference secrets, check out code, or mutate state.
permissions: {}

concurrency:
  group: source-notification-${{ github.ref_name }}-${{ inputs.contextSha && 'context' || 'eval' }}
  cancel-in-progress: true

jobs:
  acknowledge:
    name: Validate source notification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TARGET_REF: ${{ github.ref }}
      CONTEXT_SHA: ${{ inputs.contextSha }}
      EVAL_SHA: ${{ inputs.evalSha }}
      DISPATCH_ACTOR: ${{ github.actor }}
    steps:
      - name: Validate dispatch envelope
        shell: bash
        run: |
          set -euo pipefail


          source_count=0
          source_kind=""
          source_sha=""
          if [[ -n "$CONTEXT_SHA" ]]; then
            source_count=$((source_count + 1))
            source_kind="context"
            source_sha="$CONTEXT_SHA"
          fi
          if [[ -n "$EVAL_SHA" ]]; then
            source_count=$((source_count + 1))
            source_kind="eval"
            source_sha="$EVAL_SHA"
          fi
          if [[ "$source_count" -ne 1 ]]; then
            echo "::error title=Invalid source envelope::Exactly one of contextSha or evalSha must be provided"
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid source SHA::${source_kind}Sha must be a full lowercase 40-character Git SHA"
            exit 1
          fi
          # context 真源仍固定通知 main；eval 修复跟随业务默认分支 dev。
          # 分开目标 ref，也让两类回执在独立 concurrency group 中互不取消。
          case "$source_kind" in
            context) expected_ref="refs/heads/main" ;;
            eval) expected_ref="refs/heads/dev" ;;
          esac
          if [[ "$TARGET_REF" != "$expected_ref" ]]; then
            echo "::error title=Unexpected target ref::Expected ${expected_ref} for ${source_kind}, got ${TARGET_REF}"
            exit 1
          fi

          {
            echo '### Source notification accepted'
            printf -- '- source: `%s`\n' "$source_kind"
            printf -- '- source commit: `%s`\n' "$source_sha"
            printf -- '- target ref: `%s`\n' "$TARGET_REF"
            printf -- '- dispatch actor: `%s`\n' "$DISPATCH_ACTOR"
            echo
            echo '> Receipt only: this workflow does not copy context or eval data and does not modify this repository.'
          } >> "$GITHUB_STEP_SUMMARY"
