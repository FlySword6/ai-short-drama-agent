[project]
name = "shortdrama-cli"
version = "0.3.2"
description = "Agent-oriented CLI for the frozen shortdrama v0.3 production API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # The floor is a trust-store freshness floor: scripts/build-volcengine-release.sh
  # resolves with UV_RESOLUTION=lowest-direct, so a loose bound ships a stale bundle.
  "certifi>=2026.7.22",
  "pydantic>=2.7,<3",
  "rich>=13.0",
  "typer>=0.16.1",
]

[project.scripts]
shortdrama = "shortdrama_cli.main:app"
shortdrama-cli = "shortdrama_cli.main:app"

[dependency-groups]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
  "pyyaml>=6.0",
  "setuptools==80.9.0",
  "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortdrama_cli"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
