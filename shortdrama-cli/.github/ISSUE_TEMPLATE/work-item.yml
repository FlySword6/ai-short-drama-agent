name: 工作卡
description: 提交缺陷、功能、部署、治理、调研或经验沉淀事项。
title: "[工作卡] "
body:
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 不解决不部署/生产事故
        - P1 当前迭代必须
        - P2 排队
        - P3 机会性
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 类型
      options:
        - 缺陷
        - 功能
        - 部署
        - 治理
        - 调研
        - 经验沉淀
    validations:
      required: true
  - type: dropdown
    id: team
    attributes:
      label: 归属组
      options:
        - col 平台工程
        - vNext
        - test 链
        - coding-environment
        - 资产库
        - 产品定义
        - 待分诊
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景
      description: 用一句话说明现象或需求、谁被影响，以及为什么要处理。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 写清怎么算完成，结果必须可以核对。
    validations:
      required: true
