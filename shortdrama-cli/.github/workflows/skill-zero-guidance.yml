name: Skill zero-guidance

on:
  workflow_call:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.1
        required: true
        type: string
    secrets:
      TEST_ENV_ADMIN_USERNAME:
        required: true
      TEST_ENV_ADMIN_PASSWORD:
        required: true
      OPENAI_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.3.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-zero-guidance-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Run three clean Skill zero-guidance sessions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment: test
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      UV_VERSION: "0.7.13"
      SHORTDRAMA_ENV: test
      CLI_E2E_TARGET_ENVIRONMENT: test
      CLI_E2E_RELEASE_TAG: ${{ inputs.tag }}
      CLI_E2E_USERNAME: ${{ secrets.TEST_ENV_ADMIN_USERNAME }}
      SHORTDRAMA_API_TOKEN: ${{ secrets.TEST_ENV_ADMIN_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select and verify release tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must look like v1.2.3."
            exit 1
          fi
          tag_ref="refs/tags/${RELEASE_TAG}"
          if ! git show-ref --verify --quiet "${tag_ref}"; then
            echo "::error::Release tag '${RELEASE_TAG}' does not exist. Create and push the tag before running this workflow manually."
            exit 1
          fi
          git checkout --detach "${tag_ref}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies and Codex
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --frozen
          npm install --global @openai/codex@0.145.0

      - name: Run three clean Skill zero-guidance sessions
        run: >-
          python scripts/e2e/run_skill_zero_guidance.py
          --release-tag "${RELEASE_TAG}"
          --summary artifacts/skill-zero-guidance/summary.json
          --artifact-dir artifacts/skill-zero-guidance

      - name: Upload Skill zero-guidance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shortdrama-cli-skill-zero-guidance-${{ env.RELEASE_TAG }}
          path: artifacts/skill-zero-guidance/
          if-no-files-found: warn
