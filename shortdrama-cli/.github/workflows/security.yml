name: CLI Security

on:
  pull_request:
  push:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.13"

jobs:
  repository-policy:
    # Transitional rollout: block unsafe code introduced or modified by this
    # change, while legacy runtime findings remain visible to the strict
    # Release gate.  This must return to a whole-tree required check after
    # the endpoint/session runtime migration lands.
    name: Repository policy (changed files)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Block unsafe findings introduced by this change
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide a valid head SHA."
            exit 1
          fi
          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ &&
                "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            base="${BASE_SHA}"
          else
            # A force-push can make github.event.before unavailable or no
            # longer ancestral. Rebuild the current PR/push range from its
            # trusted locally checked-out mainline merge base rather than
            # skipping the check. Do not fetch here: Fork Actions deliberately
            # keep credentials out of the checkout.
            main_ref="refs/remotes/origin/main"
            if ! git show-ref --verify --quiet "${main_ref}"; then
              echo "::error::Checkout did not provide the trusted main reference; refusing to skip security scanning."
              exit 1
            fi
            if ! base="$(git merge-base "${HEAD_SHA}" "${main_ref}")"; then
              echo "::error::Could not compute a comparison base; refusing to skip security scanning."
              exit 1
            fi
          fi
          args=(repository --root . --changed-since "${base}..${HEAD_SHA}")
          if git cat-file -e "${base}:.security/security-baseline.json" 2>/dev/null; then
            git show "${base}:.security/security-baseline.json" > "${RUNNER_TEMP}/security-baseline.base.json"
            args+=(--baseline-base "${RUNNER_TEMP}/security-baseline.base.json")
          fi
          python scripts/security_action.py "${args[@]}"

  tests:
    name: Full test suite
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          "uv==${{ env.UV_VERSION }}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run --frozen pytest -q

  security-action-tests:
    name: Security Action tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          "uv==${{ env.UV_VERSION }}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run Security Action test entry
        run: make security-test

  dependency-audit:
    name: Dependency vulnerability and SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          "uv==${{ env.UV_VERSION }}"

      - name: Audit runtime dependencies
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --progress-spinner=off --format cyclonedx-json --output "${RUNNER_TEMP}/runtime-sbom.cdx.json" --requirement "${RUNNER_TEMP}/runtime-requirements.txt"
          test -s "${RUNNER_TEMP}/runtime-sbom.cdx.json"

      - name: Preserve runtime SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shortdrama-cli-runtime-sbom
          path: ${{ runner.temp }}/runtime-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: High-confidence Python SAST
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install uv
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          "uv==${{ env.UV_VERSION }}"

      - name: Run high-confidence SAST
        run: uvx --from bandit==1.9.4 bandit -q -r src scripts --severity-level high --confidence-level high

  changed-history-secrets:
    name: Secrets introduced by this PR or push
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out full change history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Scan every commit introduced by this event
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide valid commit SHAs for history scanning."
            exit 1
          fi
          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ &&
                "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]] &&
             git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            revision="${BASE_SHA}..${HEAD_SHA}"
          else
            # Do not silently skip a force-push. Scan every current branch
            # commit since the trusted locally checked-out mainline merge base
            # instead. The checkout intentionally has no fetch credentials.
            main_ref="refs/remotes/origin/main"
            if ! git show-ref --verify --quiet "${main_ref}"; then
              echo "::error::Checkout did not provide the trusted main reference; refusing to skip security scanning."
              exit 1
            fi
            if ! base="$(git merge-base "${HEAD_SHA}" "${main_ref}")"; then
              echo "::error::Could not compute a comparison base; refusing to skip security scanning."
              exit 1
            fi
            revision="${base}..${HEAD_SHA}"
          fi
          python scripts/security_action.py repository --root . --history-range "${revision}"

  history-secrets:
    name: Reachable Git history secret scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Scan reachable history without printing values
        run: python scripts/security_action.py repository --root . --history
