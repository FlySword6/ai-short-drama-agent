name: Release CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
      main_commit:
        description: Exact 40-character protected main SHA that the release tag must reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  UV_VERSION: "0.7.13"

jobs:
  provenance:
    name: Pin trusted release commit
    runs-on: ubuntu-22.04
    environment: release
    outputs:
      release_sha: ${{ steps.pin.outputs.release_sha }}
    steps:
      - name: Check out trusted workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Pin trusted release commit
        id: pin
        shell: bash
        env:
          TRUSTED_MAIN_SHA: ${{ inputs.main_commit }}
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${REF_PROTECTED}" != "true" ]; then
            echo "::error::Release workflow must be dispatched from protected branch main."
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '${RELEASE_TAG}'."
            exit 1
          fi
          if [[ ! "${TRUSTED_MAIN_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Approved main commit must be a full 40-character SHA."
            exit 1
          fi
          tag_ref="refs/tags/${RELEASE_TAG}"
          if ! git show-ref --verify --quiet "${tag_ref}"; then
            echo "::error::Credential-less checkout did not provide the release tag."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TRUSTED_MAIN_SHA}" "${GITHUB_SHA}"; then
            echo "::error::Approved main commit is not reachable from the protected main dispatch commit."
            exit 1
          fi
          remote_tag_sha="$(scripts/release/resolve-remote-tag-commit.sh \
            "${GITHUB_REPOSITORY}" "${RELEASE_TAG}")"
          if [ "${remote_tag_sha}" != "${TRUSTED_MAIN_SHA,,}" ]; then
            echo "::error::Remote release tag does not point at the approved main commit."
            exit 1
          fi
          release_sha="$(python scripts/release/release.py provenance \
            --tag "${RELEASE_TAG}" \
            --main-commit "${TRUSTED_MAIN_SHA}")"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

  build:
    needs: provenance
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2022
            platform: windows
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out pinned release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"


      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"

      - name: Validate release version
        run: python scripts/release/release.py validate --tag "${{ env.RELEASE_TAG }}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -q

      - name: Build app directory
        run: >-
          uv run --frozen pyinstaller
          --onedir
          --name shortdrama-cli
          --collect-data shortdrama_cli
          --collect-data certifi
          --distpath dist/app
          --workpath build/pyinstaller
          --specpath build/pyinstaller
          src/shortdrama_cli/__main__.py

      - name: Smoke test packaged CLI
        run: >-
          python scripts/release/release.py smoke
          --tag "${{ env.RELEASE_TAG }}"
          --app-dir dist/app/shortdrama-cli
          --https-probe https://api.github.com/


      - name: Scan unpacked app directory
        run: python scripts/security_action.py artifacts dist/app/shortdrama-cli
      - name: Package release asset
        run: >-
          python scripts/release/release.py package
          --tag "${{ env.RELEASE_TAG }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --app-dir dist/app/shortdrama-cli
          --output-dir release-assets

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shortdrama-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/shortdrama-cli-*
          if-no-files-found: error

  stage:
    name: Stage draft GitHub Release
    needs: [provenance, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out pinned release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"


      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Add installers and metadata
        shell: bash
        run: |
          cp scripts/install-shortdrama-cli.sh release-assets/install-shortdrama-cli.sh
          cp scripts/install-shortdrama-cli.ps1 release-assets/install-shortdrama-cli.ps1
          python scripts/release/release.py metadata --tag "${RELEASE_TAG}" --artifacts-dir release-assets


      - name: Recheck pinned tag and create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release_sha }}
        run: |
          remote_tag_sha="$(scripts/release/resolve-remote-tag-commit.sh \
            "${GITHUB_REPOSITORY}" "${RELEASE_TAG}")"
          if [ "${remote_tag_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Release tag moved after provenance verification."
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
            if [ "${is_draft}" != "true" ]; then
              echo "::error::Release '${RELEASE_TAG}' is already published; refusing to overwrite it before the gate."
              exit 1
            fi
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/* --draft --verify-tag --generate-notes --title "shortdrama-cli ${RELEASE_TAG}"
          fi

  security-gate:
    name: Release repository security gate
    needs: [provenance, stage]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out pinned release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"


      - name: Install uv
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          "uv==${{ env.UV_VERSION }}"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Enforce repository security policy
        run: python scripts/security_action.py repository --root . --strict

      - name: Scan reachable Git history for secrets
        run: python scripts/security_action.py repository --root . --history

      - name: Audit runtime dependencies
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --progress-spinner=off --format cyclonedx-json --output "${RUNNER_TEMP}/runtime-sbom.cdx.json" --requirement "${RUNNER_TEMP}/runtime-requirements.txt"
          test -s "${RUNNER_TEMP}/runtime-sbom.cdx.json"

      - name: Run high-confidence SAST
        run: uvx --from bandit==1.9.4 bandit -q -r src scripts --severity-level high --confidence-level high

  release-gate:
    name: Release artifact execution gate
    needs: stage
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download Linux x64 release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shortdrama-cli-linux-x64
          path: release-gate-assets

      - name: Execute the packaged CLI and verify the bundled Skill
        shell: bash
        run: |
          archive="$(find release-gate-assets -maxdepth 1 -type f -name 'shortdrama-cli-*-linux-x64.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir release-gate-install
          tar -xzf "${archive}" -C release-gate-install
          test "$(release-gate-install/shortdrama-cli/shortdrama-cli --version)" = "${RELEASE_TAG#v}"
          test -f release-gate-install/shortdrama-cli/skills/shortdrama-cli/SKILL.md

  # Skill zero-guidance and cross-system product verification remain independent
  # manual workflows and do not block this CLI-owned release.
  publish:
    name: Publish gated GitHub Release
    needs: [provenance, release-gate, security-gate]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out pinned release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.provenance.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false


      - name: Recheck pinned tag and publish staged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release_sha }}
        run: |
          remote_tag_sha="$(scripts/release/resolve-remote-tag-commit.sh \
            "${GITHUB_REPOSITORY}" "${RELEASE_TAG}")"
          if [ "${remote_tag_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Release tag moved after provenance verification."
            exit 1
          fi
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
