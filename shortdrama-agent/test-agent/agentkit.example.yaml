# Safe reference only. Never commit a generated `agentkit.yaml`.
#
# A credential owner generates the canonical `agentkit.yaml` locally or in a
# controlled deployment environment. It is ignored by Git and must obtain
# secrets from the approved secret/IAM mechanism, not from this file.
common:
  agent_name: short_drama_asset_agent
  entry_point: agent_a2a.py
  launch_type: cloud
  runtime_envs:
    VOLCENGINE_ACCESS_KEY: ${VOLCENGINE_ACCESS_KEY}
    VOLCENGINE_SECRET_KEY: ${VOLCENGINE_SECRET_KEY}
    TOOL_MCP_ROUTER_API_KEY: ${TOOL_MCP_ROUTER_API_KEY}
    DATABASE_VIKING_PROJECT: <approved-viking-project>
    DATABASE_VIKING_COLLECTION: <approved-viking-collection>
    DATABASE_VIKINGMEM_COLLECTION: <approved-memory-collection>
    MODEL_AGENT_NAME: <server-mapped-model>
    AGENTKIT_REGION: <approved-region>
launch_types:
  cloud:
    tos_bucket: <approved-tos-bucket>
    tos_prefix: <approved-tos-prefix>
    tos_region: <approved-region>
    runtime_apikey: ${AGENTKIT_RUNTIME_API_KEY}
    runtime_endpoint: <platform-runtime-endpoint>
