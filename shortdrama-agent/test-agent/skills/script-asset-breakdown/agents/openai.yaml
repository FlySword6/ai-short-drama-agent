interface:
  display_name: "Script Asset Breakdown"
  short_description: "将漫剧短剧文本拆解为角色场景道具分镜和制作任务资产，并在上下文完整时直接入库"
  default_prompt: "Use $script-asset-breakdown 拆解这段剧本；如用户已给出 project_name、episode_no、shot_no，请先调用 listProjects 查询项目主表，未命中则调用 createProject 创建项目并取得真实 project_id；再对每个镜头调用 lookupProjectShotId 查询 project_shot_id，未命中则调用 createProjectShot 创建镜头并取得真实 project_shot_id；最后组装 storyboard_ingestion_request 并调用 ingestStoryboardDecomposition。不要调用 createProjectPrompt 或 createProjectShotGeneration 代替创建项目/镜头主数据；只有在创建图片任务前缺少资产提示词时，才可调用 createProjectPrompt 创建项目资产提示词。"

dependencies:
  tools:
    - type: "mcp"
      value: "server-api"
      description: "Short drama server API MCP tools for project lookup, shot lookup, storyboard ingestion, project prompts, and shot image generation."
      transport: "streamable_http"
      url: "https://sd8uhlrhrjmurblmec7o0.apigateway-cn-beijing.volceapi.com/mcp"

policy:
  allow_implicit_invocation: true
