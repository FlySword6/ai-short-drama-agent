[project]
name = "sd-orchestrator"
version = "0.1.0"
# AgentKit 0.2 imports ``typing.override``, which is available from Python 3.12.
# Keep local ADK development aligned with the Docker runtime.
requires-python = ">=3.12"
dependencies = [
    "agentkit-sdk-python==0.2.0",
    "veadk-python[extensions]==0.5.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "redis>=5.0",
]

[tool.uv]
dev-dependencies = []
