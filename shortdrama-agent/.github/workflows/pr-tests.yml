name: PR Tests

# 合并前自动跑 pi-http-wrapper 与 production-chain-agent 两个包的全部测试。
# 在这之前本仓 .github/workflows 是空的，一份 PR 能不能合全靠人读 diff（Issue #5）。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.13"
  PYTHON_VERSION: "3.12"

jobs:
  pi-http-wrapper:
    name: pi-http-wrapper tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"

      # 本包依赖 shortdrama-cli，它住在同组织的另一个私有仓
      # (col-shortdrama/zhongwen-shortdrama-cli)。Actions 默认的 GITHUB_TOKEN
      # 只覆盖当前仓库，读不到它，所以需要一个只读的跨仓凭据。
      #
      # 原本设计用 deploy key（绑仓不绑人、不过期），但 2026-08-13 实测
      # col-shortdrama 这个组织把 deploy key 整个禁掉了，三个仓一律返回
      # "Deploy keys are disabled for this repository" (HTTP 422)。所以改用
      # 细粒度 PAT：权限只勾 Contents=Read，仓库只选 zhongwen-shortdrama-cli。
      #
      # 代价是它绑在签发人账号上、且会到期。到期或人员变动时 CI 会以
      # 401 失败（不是静默跳过），届时重新签一把即可。长期解法是改用
      # GitHub App 安装令牌，见 issue #5 的讨论。
      #
      # 缺凭据时这一步直接失败：门禁不能因为装不上依赖就"绿着跳过"。
      - name: Check cross-repo credential
        env:
          CLI_REPO_READ_TOKEN: ${{ secrets.CLI_REPO_READ_TOKEN }}
        run: |
          if [ -z "${CLI_REPO_READ_TOKEN}" ]; then
            echo "::error::missing secret CLI_REPO_READ_TOKEN — a fine-grained PAT with Contents:Read on the private CLI repo, needed to install shortdrama-cli. See issue #5."
            exit 1
          fi

      - name: Install package and test dependencies
        env:
          CLI_REPO_READ_TOKEN: ${{ secrets.CLI_REPO_READ_TOKEN }}
        run: |
          # pyproject 钉的是 git+https 地址，所以给 https 配一个凭据助手。
          # 助手是个函数，每次被调用时才从环境变量里读令牌——令牌不落盘，
          # 不写进 ~/.gitconfig，也不出现在任何命令行里（ps 看不到）。
          # checkout 已经跑完，这条只影响下面 pip 拉 CLI 包那一次。
          git config --global credential.helper \
            '!f() { echo username=x-access-token; echo "password=${CLI_REPO_READ_TOKEN}"; }; f'
          uv venv --python "${PYTHON_VERSION}" .venv-wrapper
          VIRTUAL_ENV=.venv-wrapper uv pip install -e "pi-http-wrapper[test]" pytest

      - name: Run tests
        working-directory: pi-http-wrapper
        run: |
          ../.venv-wrapper/bin/python -m pytest tests -q -rs \
            --junitxml="${RUNNER_TEMP}/pi-http-wrapper.xml"

      - name: Report totals
        if: always()
        run: python3 scripts/ci/summarise-junit.py "${RUNNER_TEMP}/pi-http-wrapper.xml" pi-http-wrapper

  production-chain-agent:
    name: production-chain-agent tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"

      # uv.lock 里记的 registry 是清华镜像，GitHub runner 在境外走它又慢又不稳，
      # 所以这里按 requirements.txt 从 PyPI 装。锁文件仍是部署时的真源，
      # 换成 `uv sync --frozen` 需要先把 registry 迁回 PyPI，属另一张卡。
      - name: Install test dependencies
        run: |
          uv venv --python "${PYTHON_VERSION}" .venv-chain
          VIRTUAL_ENV=.venv-chain uv pip install \
            -r production-chain-agent/requirements.txt pytest

      - name: Run tests
        working-directory: production-chain-agent
        run: |
          ../.venv-chain/bin/python -m pytest tests -q -rs \
            --junitxml="${RUNNER_TEMP}/production-chain-agent.xml"

      - name: Report totals
        if: always()
        run: python3 scripts/ci/summarise-junit.py "${RUNNER_TEMP}/production-chain-agent.xml" production-chain-agent
