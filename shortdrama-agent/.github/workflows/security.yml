name: Agent repository security

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "integration/**"
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-security-tests:
    name: Cross-platform security tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run portable security tests
        run: python -m unittest discover -s security/tests -v

      - name: Run local test-agent server security tests
        working-directory: test-agent
        run: python -B -m unittest tests.test_local_server_security -v

  repository-policy:
    name: Repository policy and synthetic tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Test repository guard
        run: python -m unittest discover -s security/tests -v

      - name: Read trusted baseline from the PR base commit
        id: baseline-base
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_BASE_PATH: ${{ runner.temp }}/legacy-baseline.base.json
        run: |
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide a valid PR base SHA."
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "::error::The trusted PR base commit is unavailable."
            exit 1
          fi
          if git cat-file -e "${BASE_SHA}:security/legacy-baseline.json"; then
            git show "${BASE_SHA}:security/legacy-baseline.json" > "${BASELINE_BASE_PATH}"
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::No baseline exists on the base commit; treating this as the reviewed bootstrap PR."
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve enforcement scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
          elif [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            echo "mode=diff" >> "${GITHUB_OUTPUT}"
            echo "base=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=full" >> "${GITHUB_OUTPUT}"
          fi

      - name: Enforce repository policy
        run: >-
          python security/repository_guard.py
          --root .
          --baseline security/legacy-baseline.json
          ${{ steps.scope.outputs.mode == 'diff' && format('--diff-base {0}', steps.scope.outputs.base) || '' }}
          --format github

      - name: Prove that the PR baseline only shrinks
        if: >-
          github.event_name == 'pull_request' &&
          steps.baseline-base.outputs.available == 'true'
        run: >-
          python security/repository_guard.py
          --root .
          --baseline security/legacy-baseline.json
          --baseline-base "${{ runner.temp }}/legacy-baseline.base.json"
          ${{ steps.scope.outputs.mode == 'diff' && format('--diff-base {0}', steps.scope.outputs.base) || '' }}
          --format github

  dependency-audit:
    name: Dependency vulnerability and SBOM
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install fixed security tools
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          pip-audit==2.10.1

      - name: Resolve audit scope
        id: audit-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice::Base commit ${BASE_SHA} unavailable; running full audit."
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Dependency manifests this event changed, if any.
          CHANGED=$(git diff --name-only "${BASE_SHA}"...HEAD --             '*/requirements*.txt' '*/requirements*.lock' '*/uv.lock' '*/pyproject.toml' 'requirements*.txt' 'requirements*.lock' 'uv.lock' 'pyproject.toml' | wc -l)
          if [[ "${CHANGED}" -gt 0 ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
          else
            echo "mode=skip" >> "${GITHUB_OUTPUT}"
          fi

      - name: Audit dependencies and build temporary CycloneDX reports
        if: steps.audit-scope.outputs.mode != 'skip'
        run: >-
          python security/dependency_audit.py
          --root .
          --report-dir "${{ runner.temp }}/agent-security-sbom"

      - name: Report skipped audit
        if: steps.audit-scope.outputs.mode == 'skip'
        run: >-
          echo "::notice::No dependency manifests changed since the base
          commit; full fail-closed audit still runs on schedule."

      - name: Preserve CycloneDX reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-dependency-sbom
          path: |
            ${{ runner.temp }}/agent-security-sbom/*.cdx.json
            ${{ runner.temp }}/agent-security-sbom/dependency-inventory.json
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: High-severity Python SAST
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install fixed SAST tool
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --only-binary=:all:
          bandit==1.9.4

      - name: Run high-severity Bandit checks
        run: >-
          bandit
          --recursive
          --severity-level high
          --confidence-level high
          --exclude "*/tests/*"
          production-chain-agent
          sd-asset-agent
          sd-generation-agent
          sd-orchestrator
          sd-scene-agent
          sd-script-agent
          test-agent

  changed-history-secrets:
    name: Secrets introduced by this PR or push
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout full change history without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Scan every commit introduced by this event
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide valid commit SHAs for history scanning."
            exit 1
          fi
          if [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            revision="${HEAD_SHA}"
          else
            revision="${BASE_SHA}..${HEAD_SHA}"
          fi
          python security/repository_guard.py --root . --history-range "${revision}" --format github

  history-secrets:
    name: Reachable Git history secret scan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Scan all reachable commits without printing matched values
        run: >-
          python security/repository_guard.py
          --root .
          --history
          --format github
