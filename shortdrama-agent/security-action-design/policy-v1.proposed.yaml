# Security Action V1 proposed policy.
# Design artifact only. It is deliberately fail-closed and cannot enable paid
# production generation until the production gates at the bottom are satisfied.

schema_version: "1.1"
policy_version: "v1-proposed-2026-08-03"
status: "design_only"
mode: "enforce"
default_decision: "deny"

evaluation:
  precedence:
    - "hard_deny"
    - "deny"
    - "ask"
    - "allow"
  unknown_field_or_engine_error: "deny"
  unavailable_security_dependency: "deny"
  preflight_idempotency:
    run_before_confirmation_state_and_policy_outcome: true
    exact_actor_confirmation_quote_plan_and_key_match:
      terminal_result: "return_existing_submission"
      create_new_submission: false
      reserve_quota_again: false
      call_provider: false
    same_confirmation_with_different_key_or_plan:
      continue_to_policy_as_replay_attempt: true

identity:
  user_source:
    type: "platform_server_session"
    user_id_field: "app.users.id"
    agentkit_user_identity_is_authoritative: false
    company_sso_enabled: false
  platform_roles:
    - "administrator"
    - "operator"
    - "member"
  never_trust_identity_from:
    - "cli_argument"
    - "http_body_or_query"
    - "prompt"
    - "tool_argument"
    - "llm_output"
    - "reviewer_string"
  interactive_context:
    required:
      - "actor_user_id"
      - "session_ref"
      - "platform_role"
      - "project_id"
      - "project_role"
      - "membership_version"
      - "request_id"
      - "trace_id"
      - "issued_at"
      - "expires_at"
      - "integrity_proof"
  execution_context:
    required:
      - "actor_user_id"
      - "project_id"
      - "project_role_snapshot"
      - "membership_version_at_submission"
      - "executor_service_id"
      - "on_behalf_of_user_id"
      - "submission_id"
      - "execution_id"
      - "request_id"
      - "trace_id"
      - "issued_at"
      - "expires_at"
      - "integrity_proof"
    raw_user_session_required: false
  project_roles:
    allowed_to_request_generation:
      - "project_owner"
      - "editor"
    denied:
      - "read_only"
      - "non_member"
    global_admin_implicitly_bypasses_project_membership: false
    operator_implicitly_bypasses_project_membership: false
  async_execution:
    require_valid_original_user: true
    require_approved_executor_service: true
    require_on_behalf_of_user_binding: true
    require_valid_submission_or_execution: true
    approved_provider_services: []
    approved_asset_services: []

client_contract:
  allowed_capability_tiers:
    - "quality"
    - "fast"
  forbidden_production_fields:
    - "provider"
    - "model_id"
    - "model_name"
    - "arbitrary_size"
    - "arbitrary_resolution"
    - "price"
    - "cost_mode"
    - "provider_endpoint"
    - "approval_grant"
    - "user_id"
    - "session_id"
    - "role"
  forbidden_field_decision: "deny"
  forbidden_field_reason_code: "invalid_capability_parameter"

capability_catalog:
  production_status: "not_approved"
  source: "platform_server_versioned_catalog"
  version: null
  mappings: {}
  fail_closed_when_mapping_missing: true
  client_may_override_resolved_model_or_price: false

text_inference:
  enabled: false
  production_status: "model_and_budget_catalog_not_approved"
  approved_model_catalog: []
  route_via_platform_generation_gateway_only: true
  client_or_agent_may_supply_provider_credentials: false
  client_or_agent_may_override_model_or_destination: false

paid_generation:
  enabled: false
  disabled_reason: "production_model_spec_quota_catalog_not_approved"
  disabled_reason_code: "paid_generation_disabled"

asset_storage:
  enabled: false
  approved_bucket_catalog: []
  user_daily_object_count: 0
  project_daily_object_count: 0
  user_daily_bytes: 0
  project_daily_bytes: 0
  reserve_before_write: true
  settle_from_stored_object: true
  fail_closed_on_quota_store_unavailable: true

approval:
  authoritative_channel: "authenticated_product_page"
  flow:
    - "quote"
    - "confirm"
    - "submit"
  one_submission_per_confirmation: true
  database_unique_constraint: "UNIQUE(confirmation_id)"
  confirmation_is_server_side_record: true
  confirmation_is_client_bearer_secret: false
  chat_confirmation_is_authoritative: false
  reviewer_string_is_authoritative: false
  auto_approve_is_authoritative: false
  cli_yes_is_authoritative: false
  approval_url:
    must_match_trusted_frontend_route: true
    allow_bearer_or_signed_query: false
    allow_transferable_authorization: false
  controlled_cli:
    allowed_for_project_authorized_personnel_only: true
    require_explicit_quote_parameter: true
    suggested_parameter: "--submit-confirmed-quote"
    parameter_is_authorization: false
    workbuddy_or_codex_may_autofill_parameter: false

state_machine:
  states:
    - "draft"
    - "quoted"
    - "confirmed"
    - "submitted"
    - "executing"
    - "settled"
    - "reconcile_required"
  submit_transaction_requires:
    - "atomic_confirmation_compare_and_consume"
    - "database_unique_confirmation_id"
    - "current_project_membership_check"
    - "current_project_role_is_project_owner_or_editor"
    - "membership_version_revalidated"
    - "atomic_user_and_project_quota_reservation"
    - "unique_idempotency_record"
    - "submission_job_and_plan_items_created"
    - "business_ledger_and_security_audit_written"
  provider_timeout:
    transition_to: "reconcile_required"
    automatic_regeneration: false
  execution_claim:
    atomic_compare_and_claim_required: true
    bind_executor_service_id: true
    require_lease_owner: true
    require_lease_expires_at: true
    require_monotonic_fencing_token: true
    stale_or_mismatched_fencing_token: "deny"

quota:
  fail_closed_on_store_unavailable: true
  user_daily: 0
  project_daily: 0
  text_user_daily_tokens: 0
  text_project_daily_tokens: 0
  reserve_before_submission: true
  settle_from_provider_result: true
  overage_approver: null

actions:
  model.send:
    context_type: "execution"
    allowed_runtime: "platform_provider_worker_or_generation_gateway"
    require_authenticated_original_user: true
    require_current_project_membership: true
    require_current_project_role:
      - "project_owner"
      - "editor"
    require_membership_version_revalidation: true
    require_atomic_execution_item_claim: true
    require_execution_lease_binding: true
    require_approved_executor_service: true
    require_approved_model_catalog_mapping: true
    require_atomic_text_quota_reservation: true
    require_full_provider_body_dlp: true
    require_approved_destination: true
    hard_deny_when:
      any:
        - "text_inference.enabled != true"
        - "actor_user.status != active"
        - "caller.runtime == agent"
        - "caller.runtime == cli"
        - "current_project_membership != true"
        - "execution.atomic_claim_result != acquired"
        - "execution.executor_service_id != caller.service_id"
        - "execution.lease_owner != caller.instance_id"
        - "execution.lease_expired == true"
        - "execution.fencing_token != current_fencing_token"
        - "quota.text_user_available != true"
        - "quota.text_project_available != true"
        - "data.classification in [secret, unknown]"
        - "data.secret_findings != []"
        - "data.classification == restricted and data.restricted_release_authorized != true"
        - "reference.cross_project == true"
        - "model_mapping.status != approved"
        - "destination.status != approved"
    allow_when:
      all:
        - "caller.service_id in approved_provider_services"
        - "actor_user.status == active"
        - "current_project_membership == true"
        - "current_project_role in [project_owner, editor]"
        - "membership_version_revalidation == valid"
        - "execution.atomic_claim_result == acquired"
        - "execution.executor_service_id == caller.service_id"
        - "execution.lease_owner == caller.instance_id"
        - "execution.lease_expired != true"
        - "execution.fencing_token == current_fencing_token"
        - "model_mapping.status == approved"
        - "destination.status == approved"
        - "quota.text_reservation_status == valid"
        - "data.classification in [internal, public] or data.restricted_release_authorized == true"

  generation.quote:
    context_type: "interactive"
    require_authenticated_user: true
    require_current_project_role:
      - "project_owner"
      - "editor"
    require_paid_generation_enabled: true
    require_approved_capability_mapping: true
    deny_when:
      any:
        - "data.classification in [secret, unknown]"
        - "data.secret_findings != []"
        - "reference.cross_project == true"
    allow_when:
      all:
        - "current_project_membership == true"
        - "current_project_role in [project_owner, editor]"
        - "capability_tier in [quality, fast]"
        - "capability_mapping.status == approved"

  generation.confirm:
    context_type: "interactive"
    require_authenticated_product_page: true
    require_same_actor_and_project_as_quote: true
    require_current_project_role:
      - "project_owner"
      - "editor"
    require_membership_version_match: true
    require_quote_status: "quoted"
    require_quote_not_expired: true
    require_plan_digest_match: true
    hard_deny_when:
      any:
        - "paid_generation.enabled != true"
        - "actor_user.status != active"
        - "current_project_role not in [project_owner, editor]"
        - "membership_version_match != true"
        - "quote.status != quoted"
        - "quote.expired == true"
        - "plan_digest_match != true"
    allow_when:
      all:
        - "authenticated_channel == product_page"
        - "actor_user.status == active"
        - "same_actor_and_project_as_quote == true"
        - "current_project_role in [project_owner, editor]"
        - "membership_version_match == true"
        - "quote.status == quoted"
        - "quote.expired != true"
        - "plan_digest_match == true"

  generation.submit:
    context_type: "interactive"
    require_same_actor_and_project_as_quote: true
    require_current_project_membership: true
    require_current_project_role:
      - "project_owner"
      - "editor"
    require_membership_version_revalidation: true
    require_atomic_confirmation_consumption: true
    require_atomic_user_and_project_quota_reservation: true
    require_unique_idempotency_key: true
    idempotent_replay:
      exact_actor_confirmation_quote_plan_and_key_match: "return_existing_submission_without_new_reservation_or_provider_call"
      consumed_confirmation_with_different_key_or_plan: "deny"
    hard_deny_when:
      any:
        - "paid_generation.enabled != true"
        - "actor_user.status != active"
        - "capability_catalog.production_status != approved"
        - "confirmation.status in [invalid, expired, mismatched]"
        - "confirmation.status == consumed and idempotent_replay.exact_match != true"
        - "current_project_role not in [project_owner, editor]"
        - "membership_version_revalidation != valid"
        - "quota.user_available != true"
        - "quota.project_available != true"
        - "data.classification in [secret, unknown]"
        - "reference.cross_project == true"
    ask_when:
      all:
        - "quote.status == quoted"
        - "confirmation.status == absent"
        - "actor_user.status == active"
        - "same_actor_and_project_as_quote == true"
        - "current_project_role in [project_owner, editor]"
        - "membership_version_revalidation == valid"
        - "quote.expired != true"
    allow_when:
      all:
        - "confirmation.status == confirmed"
        - "actor_user.status == active"
        - "same_actor_and_project_as_quote == true"
        - "current_project_role in [project_owner, editor]"
        - "membership_version_revalidation == valid"
        - "capability_catalog.production_status == approved"
        - "quota.user_available == true"
        - "quota.project_available == true"
        - "atomic_confirmation_quota_and_submission_transaction == ready"

  provider.media_execute:
    context_type: "execution"
    allowed_runtime: "platform_provider_worker_or_generation_gateway"
    require_approved_executor_service: true
    require_valid_submission_and_execution_item: true
    require_execution_item_unconsumed: true
    require_atomic_execution_item_claim: true
    require_execution_lease_binding: true
    require_current_project_membership: true
    require_current_project_role:
      - "project_owner"
      - "editor"
    require_membership_version_revalidation: true
    require_reserved_quota: true
    require_capability_catalog_match: true
    require_full_provider_body_dlp: true
    require_approved_destination: true
    hard_deny_when:
      any:
        - "paid_generation.enabled != true"
        - "actor_user.status != active"
        - "caller.runtime == agent"
        - "caller.runtime == cli"
        - "execution.status != valid"
        - "execution.plan_item_status != unconsumed"
        - "execution.atomic_claim_result != acquired"
        - "execution.executor_service_id != caller.service_id"
        - "execution.lease_owner != caller.instance_id"
        - "execution.lease_expired == true"
        - "execution.fencing_token != current_fencing_token"
        - "current_project_membership != true"
        - "current_project_role not in [project_owner, editor]"
        - "membership_version_revalidation != valid"
        - "quota.reservation_status != valid"
        - "capability_mapping.status != approved"
        - "data.classification in [secret, unknown]"
        - "data.secret_findings != []"
        - "data.classification == restricted and data.restricted_release_authorized != true"
        - "reference.cross_project == true"
        - "destination.status != approved"
    allow_when:
      all:
        - "caller.service_id in approved_provider_services"
        - "actor_user.status == active"
        - "execution.status == valid"
        - "execution.plan_item_status == unconsumed"
        - "execution.atomic_claim_result == acquired"
        - "execution.executor_service_id == caller.service_id"
        - "execution.lease_owner == caller.instance_id"
        - "execution.lease_expired != true"
        - "execution.fencing_token == current_fencing_token"
        - "current_project_membership == true"
        - "current_project_role in [project_owner, editor]"
        - "membership_version_revalidation == valid"
        - "quota.reservation_status == valid"
        - "capability_mapping.status == approved"
        - "destination.status == approved"
        - "data.classification in [internal, public] or data.restricted_release_authorized == true"

  asset.store:
    context_type: "execution"
    allowed_runtime: "platform_asset_worker"
    require_approved_executor_service: true
    require_settled_or_verified_provider_output: true
    require_current_project_membership: true
    require_object_authorization: true
    require_server_generated_project_prefix: true
    require_private_acl: true
    require_encryption_at_rest: true
    require_content_type_size_and_checksum_validation: true
    require_unique_asset_registration_id: true
    require_atomic_storage_quota_reservation: true
    require_atomic_asset_registration_claim: true
    return_platform_asset_id_only: true
    hard_deny_when:
      any:
        - "asset_storage.enabled != true"
        - "caller.runtime in [agent, cli]"
        - "source.status not in [settled_provider_output, verified_upload]"
        - "current_project_membership != true"
        - "object.project_id != execution.project_id"
        - "bucket.status != approved"
        - "object_key.generated_by_server != true"
        - "object_key.project_prefix_match != true"
        - "acl != private"
        - "encryption_at_rest != true"
        - "content_validation != valid"
        - "asset_registration.idempotency_status != valid"
        - "asset_registration.atomic_claim_result != acquired"
        - "storage_quota.user_object_count_available != true"
        - "storage_quota.project_object_count_available != true"
        - "storage_quota.user_bytes_available != true"
        - "storage_quota.project_bytes_available != true"
    allow_when:
      all:
        - "asset_storage.enabled == true"
        - "caller.service_id in approved_asset_services"
        - "source.status in [settled_provider_output, verified_upload]"
        - "current_project_membership == true"
        - "object.project_id == execution.project_id"
        - "bucket.status == approved"
        - "object_key.generated_by_server == true"
        - "object_key.project_prefix_match == true"
        - "acl == private"
        - "encryption_at_rest == true"
        - "content_validation == valid"
        - "asset_registration.idempotency_status == valid"
        - "asset_registration.atomic_claim_result == acquired"
        - "storage_quota.atomic_reservation_status == valid"

  restricted_external_actions:
    action_names:
      - "vikingdb.read"
      - "vikingdb.write"
      - "a2a.discover"
      - "a2a.invoke"
      - "mcp.invoke"
      - "skill.execute"
    production_decision: "deny"
    release_requires:
      - "approved_service_identity"
      - "object_authorization"
      - "resource_allowlist"
      - "data_classification"
      - "audit"
      - "verified_network_egress"

agent_runtime:
  cloud_credentials_present: false
  direct_ark: "deny"
  direct_tos: "deny"
  direct_vikingdb: "deny"
  arbitrary_public_internet: "deny"
  arbitrary_a2a_hub: "deny"
  allowed_internal_origins: []
  production_startup_fail_when_cloud_credentials_present: true
  untrusted_runtime_fields:
    - "ARK_BASE_URL"
    - "model_api_key"
    - "VOLCENGINE_ACCESS_KEY"
    - "VOLCENGINE_SECRET_KEY"
    - "reviewer"
    - "auto_approve_generated_assets"

production_cli:
  trusted_endpoint_sources:
    - "release_embedded_allowlist"
    - "administrator_signed_configuration"
    - "managed_device_endpoint_id"
  managed_service_endpoints: []
  endpoint_match_fields:
    - "service_id"
    - "scheme"
    - "host"
    - "port"
    - "fixed_base_path"
    - "credential_audience"
  ordinary_cli_may_create_trusted_endpoint: false
  session_bound_to_endpoint_and_audience: true
  allow_arbitrary_api_base: false
  allow_cross_origin_authorization: false
  allow_http: false
  follow_api_redirects: false
  allow_credential_in_argv: false
  credential_storage:
    windows: "Credential Manager"
    macos: "Keychain"
    linux: "Secret Service or approved secure backend"
    plaintext_fallback: "deny"
    allow_memory_only_session_when_secure_storage_unavailable: true
  direct_agent_gateway: "deny"
  direct_ark_or_agentkit: "deny"
  mock_loads_production_session: false
  mock_network_access: false
  output_schema_allowlist_required: true

network_zones:
  agent:
    default_egress: "deny"
    allow_platform_internal_api_only: true
    approved_internal_destinations: []
    deny_ark_tos_and_public_internet: true
    verified: false
  provider_worker:
    default_egress: "deny"
    approved_cloud_destinations: []
    approved_control_plane_destinations: []
    require_https: true
    verified: false
    reject:
      - "userinfo_url"
      - "ip_literal_unless_explicitly_approved"
      - "private_or_link_local_redirect"
      - "unapproved_port"
      - "cross_origin_redirect"
      - "dns_rebinding"
    l7_method_and_path_enforcement_verified: false
  asset_worker:
    default_egress: "deny"
    approved_tos_endpoints: []
    approved_bucket_ids: []
    approved_secret_control_plane_destinations: []
    require_separate_minimum_permission_tos_credentials: true
    require_https: true
    verified: false
    reject:
      - "public_acl"
      - "caller_supplied_bucket_or_object_prefix"
      - "cross_project_object_prefix"
      - "unapproved_endpoint_or_bucket"
      - "cross_origin_redirect"
  ingress:
    alb_source_restriction_verified: false
    direct_agent_public_ingress: "deny"
  database:
    rds_allowlist_verified: false
  cloud_network_owner: null

data_handling:
  unknown_classification: "deny"
  classification_source:
    recompute_in_gateway_from_normalized_full_provider_body: true
    include:
      - "system_prompt"
      - "user_prompt"
      - "tool_results"
      - "attachment_content_or_reference_metadata"
      - "all_provider_request_fields"
    never_trust_from:
      - "cli"
      - "prompt"
      - "tool_arguments"
      - "llm_output"
      - "agent_caller_label"
  restricted_release_authority: "platform_server_authorization_record"
  audit_digest: "project_scoped_hmac"
  provider_result:
    return_raw_provider_url: false
    return_platform_asset_id: true
    return_platform_authenticated_download_endpoint: true
    return_ark_or_tos_signed_direct_link: false

audit:
  common_event_envelope:
    - "event_time"
    - "request_id"
    - "actor_user_id"
    - "project_id"
    - "capability_tier"
    - "model_id"
    - "duration"
    - "result"
    - "error_code"
  business_ledger_fields:
    - "actor_user_id"
    - "project_id"
    - "quote_id"
    - "confirmation_id"
    - "submission_id"
    - "job_id"
    - "capability_tier"
    - "catalog_version"
    - "model_id"
    - "estimated_cost"
    - "actual_cost"
    - "request_id"
    - "duration"
    - "result"
    - "error_code"
  security_fields:
    - "request_id"
    - "trace_id"
    - "audit_id"
    - "policy_version"
    - "rule_id"
    - "actor_user_id"
    - "project_id"
    - "project_role_snapshot"
    - "executor_service_id"
    - "action"
    - "capability_tier"
    - "model_id"
    - "destination_id"
    - "data_classification"
    - "decision"
    - "provider_request_id"
    - "duration"
    - "error_code"
  never_record:
    - "raw_prompt"
    - "full_script"
    - "attachment_bytes"
    - "access_key"
    - "secret_key"
    - "api_key"
    - "bearer_token"
    - "cookie"
    - "database_connection_string"
    - "signed_provider_url"
    - "raw_sensitive_provider_response"
  platform_security_viewers: null
  project_business_record_viewers: null
  business_ledger_retention: null
  security_audit_retention: null

ci_security_action:
  required_in_agent_repository: true
  required_in_cli_repository: true
  required_in_platform_backend_repository: true
  platform_backend_repository_path: null
  required_checks:
    - "secret_scan_diff_current_tree_and_scheduled_full_history"
    - "dependency_vulnerability_and_sbom"
    - "sast_and_ssrf"
    - "workflow_and_action_pin_review"
    - "artifact_secret_and_endpoint_scan"
    - "repository_architecture_boundary_tests"
  production_secrets_available_to_ci: false
  fork_pull_request_write_permission: false
  required_checks_enforced_in_branch_protection_and_release: false

production_gates:
  pending_confirmation:
    model_spec_quota_catalog:
      approved: false
      blocks_paid_generation: true
      blocks_unapproved_text_inference: true
    cloud_network_owner_and_evidence:
      approved: false
      blocks_paid_generation: true
      blocks_unapproved_text_inference: true
    audit_viewers_and_retention:
      approved: false
      blocks_paid_generation: true
      blocks_unapproved_text_inference: true
  credential_incident_s001_closed:
    approved: false
    blocks_paid_generation: true
    blocks_unapproved_text_inference: true
  engineering_verification:
    platform_control_plane_and_atomic_state_machine:
      approved: false
    asset_storage_object_policy_and_evidence:
      approved: false
    agent_cli_and_main_ci_required_checks:
      approved: false
