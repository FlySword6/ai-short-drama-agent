[project]
name = "shortdrama-production-chain-agent"
version = "0.1.0"
description = "LLM-powered production chain for short-drama agents."
requires-python = ">=3.12,<3.14"
dependencies = [
  "agentkit-sdk-python==0.2.0",
  "google-adk==1.32.0",
  "veadk-python[extensions]==0.5.40",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
