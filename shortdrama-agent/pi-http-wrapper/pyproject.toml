[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortdrama-pi-http-wrapper"
version = "0.3.0"
description = "Versioned, authenticated HTTP bridge for the approved Pi runtime."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.27,<1",
  "python-multipart==0.0.20",
  "shortdrama-cli @ git+https://github.com/col-shortdrama/zhongwen-shortdrama-cli.git@fe3019b1c5e1431b4b9fb6fe327e569ad2aba6fb",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
pi-http-wrapper = "pi_http_wrapper.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
pi_http_wrapper = ["extensions/*.ts"]
